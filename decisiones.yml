{
  "version": 1,
  "review_round_limit": 3,
  "decisions": [
    {
      "id": "D-054",
      "status": "active",
      "text": "Migraciones aditivas automáticas con backup previo en post-deploy; restauraciones y rollback deben fallar cerrado."
    },
    {
      "id": "D-055",
      "status": "active",
      "text": "Durante fase construccion se permiten escrituras autónomas en producción con trazabilidad y backup; SQL destructivo o borrado irreversible requiere autorización explícita."
    },
    {
      "id": "D-056",
      "status": "active",
      "text": "Condor, GrindFlow y BRVTAL usan el sistema común de releases del kit Factory; BRVTAL reemplaza update-release-metadata.yml."
    },
    {
      "id": "D-057",
      "status": "active",
      "text": "Todo Issue y PR debe tener exactamente una etiqueta de tipo, una de prioridad y una de estado, en el idioma configurado."
    },
    {
      "id": "D-058",
      "status": "active",
      "text": "Cada tarea declara y aplica los roles profesionales que exige; la automatización no genera trabajo manual para el dueño."
    },
    {
      "id": "D-059",
      "status": "active",
      "text": "Uso de Hostinger por cualquier agente (Claude o GPT): leer y diagnosticar es libre; cambios (DNS, bases de datos, cron, deploy) requieren backup previo y registro en el Issue; borrar sitios, bases de datos o archivos requiere autorización explícita del dueño; comprar, renovar o cambiar planes y pagos nunca lo hace un agente."
    },
    {
      "id": "D-060",
      "status": "active",
      "text": "ControlBot administra solo cuentas de staff y administración de los productos; los clientes finales permanecen en su producto. La creación usa invitación, el producto gestiona contraseñas y recuperación, y el contrato remoto falla cerrado, se audita y no permite borrado físico."
    },
    {
      "id": "D-061",
      "status": "active",
      "text": "Factory, Condor, GrindFlow, BRVTAL, ControlBot, AutoFactory y FactoryRunner forman parte de la cola automática del despachador. La elegibilidad no altera sus responsabilidades arquitectónicas; el despacho conserva readiness y el orden HEALTH > INCIDENT > ACTIVE FIX > decisión del dueño respondida > crítica > alta > media."
    },
    {
      "id": "D-062",
      "status": "active",
      "text": "Los siete repositorios de la fábrica (Factory, Condor, GrindFlow, BRVTAL, ControlBot, AutoFactory y FactoryRunner) son públicos. Los términos «privado» o «cabina privada» describen acceso restringido a paneles y datos operativos, no visibilidad del repositorio; secretos, tokens y datos de clientes nunca viven en ningún repositorio."
    },
    {
      "id": "D-063",
      "status": "active",
      "text": "Mientras un proyecto esté en fase construccion y no haya nada live ni datos reales de clientes, ninguna puerta legal ni de privacidad detiene el trabajo: el agente sigue con el default seguro (documented_not_legally_approved), documenta en datos.yml y no espera al dueño. La revisión jurídica y la puerta go-live se resuelven antes de salir a live; salir a live sigue exigiendo decisión explícita del dueño."
    }
  ]
}
