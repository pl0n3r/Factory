name: Coordinación

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issues:
    types: [labeled, closed, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: coordinacion-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  # Clasificador de solo lectura; el cuerpo nunca se interpola como shell.
  preflight_comentario:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - id: route
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os

          parts = os.environ["COMMENT_BODY"].strip().split(maxsplit=1)
          supported = {
              "/tomar", "/liberar-forzado", "/adoptar-contrato-huerfana",
              "/liberar", "/transferir", "/migrar-contrato",
              "/renovar-contrato",
          }
          route = bool(parts and parts[0] in supported)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"route={str(route).lower()}\n")
          PY

  comentario:
    needs: preflight_comentario
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login &&
      needs.preflight_comentario.outputs.route == 'true'
    # El reusable mantiene el envelope compatible con callers v1.0.18;
    # la evidencia workflow_success del sweep usa lectura pública acotada.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: comment
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.comment.user.login }}
      association: ${{ github.event.comment.author_association }}
      body: ${{ github.event.comment.body }}

  etiqueta:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'estado: reservado'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: label
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.sender.login }}
      label: ${{ github.event.label.name }}

  pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # La operación pr conserva el envelope histórico de v1.0.18 y el
    # reusable sigue estrechando permisos dentro de Factory.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: pr
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action }}

  validar-pr-evento:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'

  validar-pr:
    if: github.event_name == 'pull_request'
    # El job validar-pr conserva permisos internos read-only sin exigir
    # scopes nuevos al caller histórico.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    needs: validar-pr-evento
    with:
      operation: validate
      pr_number: ${{ github.event.pull_request.number }}
      require_reservation: true

  issue:
    if: github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: issue
      issue_number: ${{ github.event.issue.number }}
      action: ${{ github.event.action }}

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: sweep
