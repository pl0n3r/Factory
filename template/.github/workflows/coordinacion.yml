name: Coordinación

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issues:
    types: [labeled, closed, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: coordinacion-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  comentario:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login &&
      (
        github.event.comment.body == '/tomar' ||
        github.event.comment.body == '/liberar-forzado' ||
        github.event.comment.body == '/adoptar-contrato-huerfana' ||
        startsWith(github.event.comment.body, '/liberar ') ||
        startsWith(github.event.comment.body, '/transferir ') ||
        startsWith(github.event.comment.body, '/migrar-contrato ') ||
        startsWith(github.event.comment.body, '/renovar-contrato ') ||
        contains(github.event.comment.body, '/tomar') ||
        contains(github.event.comment.body, '/liberar-forzado') ||
        contains(github.event.comment.body, '/adoptar-contrato-huerfana') ||
        contains(github.event.comment.body, '/liberar ') ||
        contains(github.event.comment.body, '/transferir ') ||
        contains(github.event.comment.body, '/migrar-contrato ') ||
        contains(github.event.comment.body, '/renovar-contrato ')
      )
    # GitHub valida el máximo permission envelope del reusable antes de
    # seleccionar el job interno. El reusable conserva mínimo privilegio por job.
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: comment
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.comment.user.login }}
      association: ${{ github.event.comment.author_association }}
      body: ${{ github.event.comment.body }}

  etiqueta:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'estado: reservado'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: label
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.sender.login }}
      label: ${{ github.event.label.name }}

  pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # GitHub valida el máximo permiso del reusable completo antes de evaluar
    # qué operación interna se ejecutará. La operación pr sigue estrechando
    # permisos dentro de Factory.
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: pr
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action }}

  validar-pr:
    if: github.event_name == 'pull_request'
      && github.event.pull_request.merged != true
    # Mismo sobre de carga; el job validar-pr del reusable conserva permisos
    # read-only (contents/issues/pull-requests: read).
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: validate
      pr_number: ${{ github.event.pull_request.number }}
      require_reservation: true

  issue:
    if: github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened')
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: issue
      issue_number: ${{ github.event.issue.number }}
      action: ${{ github.event.action }}

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: sweep
