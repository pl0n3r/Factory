name: Auto-merge cuando esté listo
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["CI factory", "Sonar CI-based", "Evidencia CodeQL"]
    types: [completed]
permissions:
  contents: read
jobs:
  automerge:
    if: >-
      github.repository == 'pl0n3r/Factory' &&
      github.actor != 'dependabot[bot]' &&
      (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false &&
          github.event.pull_request.base.ref == 'main') ||
        (github.event_name == 'pull_request_review' &&
          github.event.action == 'submitted') ||
        (github.event_name == 'workflow_run' &&
          github.event.action == 'completed' &&
          github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      issues: read
    steps:
      - name: Checkout de la base confiable sin credenciales persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Resolver PR y HEAD actual del evento autenticado
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          token = os.environ.get("GH_TOKEN", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          output_path = os.environ.get("GITHUB_OUTPUT", "")
          expected_repo = "pl0n3r/Factory"
          hex_sha = re.compile(r"[0-9a-f]{40}\Z")
          canonical_branch = re.compile(r"trabajo/issue-([1-9][0-9]*)\Z")
          trusted_runs = {"CI factory", "Sonar CI-based", "Evidencia CodeQL"}

          def deny(reason):
              print("AUTOMERGE_DENIED: " + reason, file=sys.stderr)
              raise SystemExit(1)

          if (repo != expected_repo or not token or not event_path or not output_path):
              deny("event_resolver_environment_invalid")
          try:
              with open(event_path, encoding="utf-8") as stream:
                  event = json.load(stream)
          except (OSError, ValueError):
              deny("event_resolver_payload_invalid")
          if not isinstance(event, dict) or not isinstance(event.get("repository"), dict):
              deny("event_repository_missing")
          if (event["repository"].get("full_name") != repo
                  or event["repository"].get("default_branch") != "main"):
              deny("event_repository_untrusted")

          pr_number = None
          expected_ref = None
          expected_sha = None
          if event_name == "pull_request":
              if event.get("action") not in {"opened", "reopened", "ready_for_review", "synchronize"}:
                  deny("pull_request_action_invalid")
              source = event.get("pull_request")
              if not isinstance(source, dict) or source.get("state") != "open" or source.get("draft") is not False:
                  deny("pull_request_state_invalid")
              head, base = source.get("head"), source.get("base")
              if not isinstance(head, dict) or not isinstance(base, dict):
                  deny("pull_request_refs_missing")
              source_repo = head.get("repo")
              if (not isinstance(source_repo, dict) or source_repo.get("full_name") != repo
                      or source_repo.get("fork") is not False or base.get("ref") != "main"):
                  deny("pull_request_source_untrusted")
              pr_number, expected_ref, expected_sha = source.get("number"), head.get("ref"), head.get("sha")
              if not isinstance(pr_number, int) or isinstance(pr_number, bool) or pr_number <= 0:
                  deny("pull_request_number_invalid")
              if not isinstance(expected_sha, str) or not hex_sha.fullmatch(expected_sha):
                  deny("pull_request_sha_invalid")
          elif event_name == "pull_request_review":
              if event.get("action") != "submitted":
                  deny("pull_request_review_action_invalid")
              review, source = event.get("review"), event.get("pull_request")
              if (not isinstance(review, dict) or review.get("state") not in {"approved", "changes_requested", "commented"}
                      or not isinstance(review.get("user"), dict)
                      or not isinstance(review["user"].get("login"), str) or not review["user"]["login"]
                      or not isinstance(source, dict)):
                  deny("pull_request_review_invalid")
              head, base = source.get("head"), source.get("base")
              if not isinstance(head, dict) or not isinstance(base, dict):
                  deny("pull_request_review_refs_missing")
              source_repo = head.get("repo")
              if (source.get("state") != "open" or source.get("draft") is not False
                      or not isinstance(source.get("number"), int) or isinstance(source.get("number"), bool)
                      or source.get("number") <= 0 or not isinstance(source_repo, dict)
                      or source_repo.get("full_name") != repo or source_repo.get("fork") is not False
                      or base.get("ref") != "main"):
                  deny("pull_request_review_source_untrusted")
              pr_number, expected_ref = source["number"], head.get("ref")
          elif event_name == "workflow_run":
              run = event.get("workflow_run")
              if (event.get("action") != "completed" or not isinstance(run, dict)
                      or run.get("name") not in trusted_runs or run.get("event") != "pull_request"
                      or run.get("status") != "completed" or run.get("conclusion") != "success"
                      or not isinstance(run.get("repository"), dict)
                      or run["repository"].get("full_name") != repo
                      or not isinstance(run.get("head_repository"), dict)
                      or run["head_repository"].get("full_name") != repo
                      or not isinstance(run.get("head_sha"), str) or not hex_sha.fullmatch(run["head_sha"])):
                  deny("workflow_run_untrusted_or_incomplete")
              pulls = run.get("pull_requests")
              if not isinstance(pulls, list) or len(pulls) != 1 or not isinstance(pulls[0], dict):
                  deny("workflow_run_pr_mapping_ambiguous")
              pr_number = pulls[0].get("number")
              expected_ref = run.get("head_branch")
              if not isinstance(pr_number, int) or isinstance(pr_number, bool) or pr_number <= 0:
                  deny("workflow_run_pr_number_invalid")
          else:
              deny("event_name_unsupported")

          if not isinstance(expected_ref, str) or not canonical_branch.fullmatch(expected_ref):
              deny("event_branch_noncanonical")
          api_url = "https://api.github.com/repos/" + repo + "/pulls/" + str(pr_number)
          request = Request(api_url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "factory-automerge-event-resolver",
          })
          try:
              with urlopen(request, timeout=10) as response:
                  current = json.load(response)
          except (HTTPError, URLError, TimeoutError, ValueError, OSError):
              deny("authenticated_pr_lookup_failed")
          if not isinstance(current, dict):
              deny("authenticated_pr_invalid")
          head, base = current.get("head"), current.get("base")
          if not isinstance(head, dict) or not isinstance(base, dict):
              deny("authenticated_pr_refs_missing")
          source_repo = head.get("repo")
          if (current.get("number") != pr_number or current.get("state") != "open"
                  or current.get("draft") is not False or head.get("ref") != expected_ref
                  or base.get("ref") != "main" or not isinstance(source_repo, dict)
                  or source_repo.get("full_name") != repo or source_repo.get("fork") is not False
                  or not isinstance(head.get("sha"), str) or not hex_sha.fullmatch(head["sha"])):
              deny("authenticated_pr_identity_changed")
          if event_name == "pull_request" and head["sha"] != expected_sha:
              deny("pull_request_head_changed_since_event")
          lines = (
              "pr_number=" + str(pr_number),
              "pr_sha=" + head["sha"],
              "pr_url=https://github.com/" + repo + "/pull/" + str(pr_number),
          )
          with open(output_path, "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          print("Resolved internal PR #" + str(pr_number) + " at authenticated HEAD " + head["sha"])
          PY
      - name: Validar evidencia y habilitar exclusivamente squash exact-HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          PR_SHA: ${{ steps.target.outputs.pr_sha }}
          PR_URL: ${{ steps.target.outputs.pr_url }}
        run: |
          set -euo pipefail
          env -u MERGE_TOKEN python3 scripts/automerge_pr_guard.py
          # Colisiones V3: comprobación independiente de Coordinación.
          env -u MERGE_TOKEN python3 scripts/coordinar_trabajo.py validar-pr --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --require-reservation
          # Revalidación de #767, freeze y evidencia exact-SHA tras Coordinación.
          env -u MERGE_TOKEN python3 scripts/automerge_pr_guard.py
          # --auto solo debe utilizarse cuando GitHub ya declara CLEAN.
          # Los PRs con checks sin terminar/merge diferido NO se encolan aquí.
          # Requerir fusión inmediata: la capacidad de auto-merge del repo no autoriza este PR a esperar.
          # El guard ya deniega pr.auto_merge preexistente; aquí nunca se crea una autorización diferida.
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if ! QUEUE_POLICY="$(gh api graphql \
            -f query='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner,name:$repo) { pullRequest(number:$number) { isMergeQueueEnabled isInMergeQueue } } }' \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F number="$PR_NUMBER" \
            --jq 'if (((.errors // []) | length) == 0) and (.data.repository.pullRequest.isMergeQueueEnabled == false) and (.data.repository.pullRequest.isInMergeQueue == false) then "safe" else "deny" end')"; then
            echo 'AUTOMERGE_DENIED: merge_queue_evidence_unknown' >&2
            exit 1
          fi
          if [[ "$QUEUE_POLICY" != safe ]]; then
            echo 'AUTOMERGE_DENIED: merge_queue_enabled_or_unknown' >&2
            exit 1
          fi
          MERGE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable_state')"
          if [[ "$MERGE_STATE" != clean ]]; then
            echo 'AUTOMERGE_DENIED: pr_not_immediately_mergeable' >&2
            exit 1
          fi
          # No crear ni reutilizar credenciales automáticamente.
          if [[ -z "${MERGE_TOKEN:-}" || "$MERGE_TOKEN" == "$GH_TOKEN" ]]; then
            echo 'AUTOMERGE_DENIED: dedicated_merge_token_missing_or_reused' >&2
            exit 1
          fi
          # PUT /merge con sha=PR_SHA es una única operación condicionada al HEAD actual.
          # La API no crea auto-merge ni añade el PR a una cola si el SHA/gates ya cambiaron.
          if ! MERGE_RESPONSE="$(GH_TOKEN="$MERGE_TOKEN" gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="$PR_SHA" -f merge_method=squash)"; then
            echo 'AUTOMERGE_DENIED: immediate_merge_api_failed' >&2
            exit 1
          fi
          if ! MERGE_SHA="$(printf '%s' "$MERGE_RESPONSE" | jq -er \
            'select(type == "object" and .merged == true and (.sha | type == "string" and test("^[0-9a-f]{40}$"))) | .sha')"; then
            echo 'AUTOMERGE_DENIED: immediate_merge_response_invalid' >&2
            exit 1
          fi
          # Confirmar por lectura independiente que el PR quedó fusionado con el commit devuelto
          # y que la identidad de HEAD del PR consultado sigue siendo el SHA validado.
          if ! MERGE_OBSERVATION="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.merged, .merged_at, .merge_commit_sha, .head.sha] | @tsv')"; then
            echo 'AUTOMERGE_DENIED: immediate_merge_observation_failed' >&2
            exit 1
          fi
          IFS=$'\t' read -r OBS_MERGED OBS_MERGED_AT OBS_MERGE_SHA OBS_HEAD_SHA <<< "$MERGE_OBSERVATION"
          if [[ "$OBS_MERGED" != true || "$OBS_MERGE_SHA" != "$MERGE_SHA" || "$OBS_HEAD_SHA" != "$PR_SHA" ||
          if [[ "$OBS_MERGED" != true || "$OBS_MERGE_SHA" != "$MERGE_SHA" || "$OBS_HEAD_SHA" != "$PR_SHA" ||
            echo 'AUTOMERGE_DENIED: immediate_merge_not_terminally_confirmed' >&2
            exit 1
          fi
          echo "AUTOMERGE_SUCCESS: immediate squash merge confirmed for HEAD $PR_SHA as $MERGE_SHA"
