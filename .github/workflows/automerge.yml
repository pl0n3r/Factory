name: Auto-merge cuando esté listo
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: read
jobs:
  automerge:
    if: github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      issues: read
    steps:
      - name: Checkout de la base confiable sin credenciales persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validar evidencia y habilitar exclusivamente squash exact-HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          python3 scripts/automerge_pr_guard.py
          # Colisiones V3: comprobación independiente de Coordinación.
          python3 scripts/coordinar_trabajo.py validar-pr --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --require-reservation
          # Revalidación de #767, freeze y evidencia exact-SHA tras Coordinación.
          python3 scripts/automerge_pr_guard.py
          # --auto solo debe utilizarse cuando GitHub ya declara CLEAN.
          # Los PRs con checks sin terminar/merge diferido NO se encolan aquí.
          # SERVER_GATES_START
          # --auto solo es elegible sin autorizacion diferida a nivel servidor
          # y sin cola de merge. Cualquier error o evidencia ausente: DENY.
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if ! SERVER_AUTO="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')"; then
            echo 'AUTOMERGE_DENIED: server_auto_merge_unknown' >&2
            exit 1
          fi
          if [[ "$SERVER_AUTO" != false ]]; then
            echo 'AUTOMERGE_DENIED: server_allows_deferred_auto_merge' >&2
            exit 1
          fi
          if ! QUEUE_POLICY="$(gh api graphql \
            -f query="query(\$owner:String!, \$repo:String!, \$number:Int!) { repository(owner:\$owner,name:\$repo) { pullRequest(number:\$number) { isMergeQueueEnabled isInMergeQueue } } }" \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F number="$PR_NUMBER" \
            --jq 'if (((.errors // []) | length) == 0) and (.data.repository.pullRequest.isMergeQueueEnabled == false) and (.data.repository.pullRequest.isInMergeQueue == false) then "safe" else "deny" end')"; then
            echo 'AUTOMERGE_DENIED: merge_queue_evidence_unknown' >&2
            exit 1
          fi
          if [[ "$QUEUE_POLICY" != safe ]]; then
            echo 'AUTOMERGE_DENIED: merge_queue_enabled_or_unknown' >&2
            exit 1
          fi
          MERGE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable_state')"
          if [[ "$MERGE_STATE" != clean ]]; then
            echo 'AUTOMERGE_DENIED: pr_not_immediately_mergeable' >&2
            exit 1
          fi
          # Un cleanup no es atómico. Nunca reportar éxito si el merge
          # no es comprobable, incluso si falla la consulta o la revocación.
          reject_unverified_merge() {
            if ! gh pr merge --disable-auto "$PR_URL"; then
              echo 'AUTOMERGE_DENIED: auto_merge_revocation_unconfirmed' >&2
            fi
            echo "AUTOMERGE_DENIED: $1" >&2
            exit 1
          }
          # Una solicitud de --auto puede dejar cola antes de responder con
          # error. Intentar revocación incluso cuando gh pr merge falla.
          if ! gh pr merge --auto --squash "$PR_URL" --match-head-commit "$PR_SHA"; then
            reject_unverified_merge 'merge_request_failed'
          fi
          if ! MERGED_AT="$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt')"; then
            reject_unverified_merge 'merge_observation_failed'
          fi
          # Solo una fecha real de mergedAt acredita la fusión terminada.
          # null, string vacío o salida extraña no autorizan un éxito.
          if [[ ! "$MERGED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$ ]]; then
            reject_unverified_merge 'merge_not_terminally_confirmed'
          fi
