name: Auto-merge cuando esté listo
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["CI factory", "Sonar CI-based", "Evidencia CodeQL"]
    types: [completed]
permissions:
  contents: read
jobs:
  automerge:
    # Fase 1: el guard y sus pruebas se integran sin conceder autoridad de merge.
    # Fase 1 no filtra eventos: cualquier disparo termina con el job omitido.
    # Fase 2 deberá restaurar filtros de evento antes de activar otro contrato.
    # El literal false mantiene la fase inerte hasta autorización independiente.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mantener auto-merge inerte durante Fase 1
        run: 'echo Fase 1 auto-merge inerte, sin secretos ni operaciones de merge.'
