name: Auto-merge cuando esté listo
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: read
jobs:
  automerge:
    if: github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      issues: read
    steps:
      - name: Checkout de la base confiable sin credenciales persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validar evidencia y habilitar exclusivamente squash exact-HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          python3 scripts/automerge_pr_guard.py
          # Colisiones V3: comprobación independiente de Coordinación.
          python3 scripts/coordinar_trabajo.py validar-pr --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --require-reservation
          # Revalidación de #767, freeze y evidencia exact-SHA tras Coordinación.
          python3 scripts/automerge_pr_guard.py
          # --auto solo debe utilizarse cuando GitHub ya declara CLEAN.
          # Los PRs con checks sin terminar/merge diferido NO se encolan aquí.
          MERGE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.mergeable_state')"
          if [[ "$MERGE_STATE" != clean ]]; then
            echo 'AUTOMERGE_DENIED: pr_not_immediately_mergeable' >&2
            exit 1
          fi
          # El --auto requerido por AC-04 opera sobre un PR ya mergeable.
          gh pr merge --auto --squash "$PR_URL" --match-head-commit "$PR_SHA"
          # Si GitHub difirió el merge pese a CLEAN, revocar auto-merge.
          # No confundir una autorización aplazada con aprobación de gates futuros.
          if [[ "$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt')" == null ]]; then
            gh pr merge --disable-auto "$PR_URL"
            echo 'AUTOMERGE_DENIED: deferred_merge_reverted' >&2
            exit 1
          fi
