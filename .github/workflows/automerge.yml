name: Auto-merge cuando esté listo
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["CI factory", "Sonar CI-based", "Evidencia CodeQL"]
    types: [completed]
permissions:
  contents: read
jobs:
  automerge:
    # Fase 1: el guard y sus pruebas se integran sin conceder autoridad de merge.
    # Los filtros de evento evitan despertar el guard ante eventos que serán rechazados.
    # El literal false mantiene la fase inerte hasta autorización independiente.
    if: ${{ false && ((github.event_name == 'pull_request_review' && github.event.action == 'submitted' && github.event.review.state == 'submitted' && github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mantener auto-merge inerte durante Fase 1
        run: 'echo Fase 1 auto-merge inerte, sin secretos ni operaciones de merge.'
