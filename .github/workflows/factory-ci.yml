name: CI factory
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    name: Lint de workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" | tar -xz actionlint
          # GitHub Actions ya soporta cache-mode y job.workflow_*; actionlint 1.7.x
          # todavía no modela esas superficies. Se ignoran solo esos falsos positivos.
          ./actionlint \
            -ignore 'unexpected key "cache-mode" for "workflow" section' \
            -ignore 'property "workflow_(repository|sha)" is not defined in object type' \
            -color
          ./actionlint -color template/.github/workflows/*.yml

  scripts:
    name: Tests de scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Sintaxis, política y suites
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          python3 scripts/politica_kit.py </dev/null
          python3 -m unittest discover -s tests -p 'test_*.py'
          if [[ -d metricas ]]; then PYTHONPATH=metricas python3 -m unittest discover -s metricas -p 'test_*.py'; fi
          if [[ -d seguridad ]]; then PYTHONPATH=seguridad python3 -m unittest discover -s seguridad -p 'test_*.py'; fi
          if [[ -d lecciones ]]; then PYTHONPATH=lecciones python3 -m unittest discover -s lecciones -p 'test_*.py'; fi
          if [[ -d producto ]]; then PYTHONPATH=producto python3 -m unittest discover -s producto -p 'test_*.py'; fi

  release_window:
    name: Ventana de release Factory
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validar freeze exact-SHA de release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^trabajo/issue-([1-9][0-9]*)$ ]] || {
            echo "::error::Rama sin Issue canónico para validar release window"
            exit 1
          }
          work_issue="${BASH_REMATCH[1]}"

          # Search Issues entrega máximo 100 filas por página; jamás decidir un freeze
          # desde un snapshot truncado (incluidos duplicados sin su canónico).
          query="repo:$REPOSITORY is:issue \"factory-human-gate\" in:body"
          # Dos consultas completas independientes evitan aceptar una mezcla
          # de páginas por un desplazamiento del índice entre lecturas.
          for pass in 1 2; do
          gh api -X GET search/issues -f q="$query" -f per_page=100 -f page=1 \
            -f sort=created -f order=asc > /tmp/release-search-p1-${pass}.json
          total_count="$(jq -er '
            if (.incomplete_results == false)
               and ((.total_count | type) == "number")
               and ((.total_count | floor) == .total_count)
               and (.total_count >= 0 and .total_count <= 200)
               and ((.items | type) == "array")
            then .total_count
            else error("Search Issues parcial, inválida o >200")
            end
          ' /tmp/release-search-p1-${pass}.json)"
          if (( total_count > 100 )); then
            gh api -X GET search/issues -f q="$query" -f per_page=100 -f page=2 \
              -f sort=created -f order=asc > /tmp/release-search-p2-${pass}.json
          else
            printf 'null\n' > /tmp/release-search-p2-${pass}.json
          fi
          python3 - /tmp/release-search-p1-${pass}.json /tmp/release-search-p2-${pass}.json <<'PY' > /tmp/release-search-verified-${pass}.json
          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          PAGE_SIZE = 100
          MAX_ROWS = 200

          def fail(reason):
              raise SystemExit("ERROR: Search Issues incompleta: " + reason)

          def read(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  fail("JSON ilegible: " + type(exc).__name__)

          first, second = (read(path) for path in sys.argv[1:3])
          if not isinstance(first, dict):
              fail("primera página inválida")
          count = first.get("total_count")
          if type(count) is not int or not 0 <= count <= MAX_ROWS:
              fail("total_count inválido o excedido")
          pages = [first]
          if count > PAGE_SIZE:
              if not isinstance(second, dict):
                  fail("segunda página ausente")
              pages.append(second)
          elif second is not None:
              fail("segunda página inesperada")

          seen = set()
          selected = []
          for page_index, page in enumerate(pages):
              if (
                  page.get("incomplete_results") is not False
                  or type(page.get("total_count")) is not int
                  or page["total_count"] != count
                  or not isinstance(page.get("items"), list)
              ):
                  fail("metadatos inconsistentes entre páginas")
              items = page["items"]
              if len(items) != min(PAGE_SIZE, count - PAGE_SIZE * page_index):
                  fail("página truncada o con filas adicionales")
              for item in items:
                  if not isinstance(item, dict):
                      fail("Issue inválido")
                  number = item.get("number")
                  if type(number) is not int or number < 1 or number in seen:
                      fail("ID ausente, inválido o duplicado")
                  seen.add(number)
                  title = item.get("title")
                  updated_at = item.get("updated_at")
                  if (
                      item.get("pull_request") is not None
                      or item.get("state") not in ("open", "closed")
                      or not isinstance(item.get("body"), str)
                      or not isinstance(title, str)
                      or not title.strip()
                      or not isinstance(updated_at, str)
                  ):
                      fail("Issue no canónico o malformado")
                  try:
                      timestamp = datetime.strptime(updated_at, "%Y-%m-%dT%H:%M:%SZ")
                      if timestamp.strftime("%Y-%m-%dT%H:%M:%SZ") != updated_at:
                          fail("updated_at no es UTC ISO-8601 canónico")
                  except ValueError:
                      fail("updated_at no es UTC ISO-8601 canónico")
                  selected.append({
                      key: item.get(key)
                      for key in ("number", "state", "title", "body", "updated_at")
                  })
          if len(seen) != count:
              fail("conteo incompleto")
          print(json.dumps(selected, ensure_ascii=False, separators=(",", ":")))
          PY
          done
          # Comparar filas completas, no solo cardinalidad ni IDs.
          # Cualquier variación del índice, bodies o metadatos niega el freeze.
          cmp -s /tmp/release-search-verified-1.json /tmp/release-search-verified-2.json || {
            echo "::error::Search Issues cambió entre dos lecturas completas"
            exit 1
          }
          jq '[
                .[]
                | select((.body // "") | contains("factory-release"))
                | {number, state, title, body, updated_at}
              ]' /tmp/release-search-verified-2.json > /tmp/release-issues.json
          printf '[]\n' > /tmp/release-gates.json
          while IFS= read -r issue; do
            number="$(jq -r '.number' <<<"$issue")"
            [[ "$number" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Issue de release inválido"
              exit 1
            }
            gh api --paginate "repos/$REPOSITORY/issues/$number/comments?per_page=100" | jq -s -e '
              def valid_comment:
                if type != "object" then false
                elif (.id | type) != "number" then false
                elif (.user | type) != "object" then false
                else (.id > 0 and (.id | floor) == .id
                      and (.user.login | type) == "string"
                      and (.body | type) == "string")
                end;
              if (length == 0 or length > 10 or any(.[]; type != "array")) then
                error("invalid_comment_pages")
              elif (any(.[]; length > 100) or
                    (length > 1 and any(.[0:-1][]; length != 100))) then
                error("incomplete_comment_pages")
              else . end
              | add
              | if (length > 1000 or any(.[]; valid_comment | not)) then
                  error("invalid_comment_shape")
                else . end
              | if ([.[].id] | unique | length) != length then
                  error("duplicate_comment_id")
                else . end
              | map(
                  select(.user.login == "github-actions[bot]")
                  | select(
                      (.body | contains("factory-human-decision"))
                      or (.body | contains("factory-release-executed"))
                      or (.body | contains("factory-human-gate-duplicate"))
                    )
                  | {user: {login: .user.login}, body: (.body // "")}
                )
            ' > /tmp/release-comments.json
            jq --argjson issue "$issue"               --slurpfile comments /tmp/release-comments.json               '. + [{issue:$issue,comments:$comments[0]}]'               /tmp/release-gates.json > /tmp/release-gates.next
            mv /tmp/release-gates.next /tmp/release-gates.json
          done < <(jq -c '.[]' /tmp/release-issues.json)

          gh api "repos/$REPOSITORY/pulls/$PR" | jq '{number, body: (.body // "")}' > /tmp/release-pr.json
          gh api "repos/$REPOSITORY/issues/$work_issue" | jq '{number, state, labels: [.labels[]? | {name}]}' > /tmp/release-work-item.json
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n             --arg now "$now"             --slurpfile gates /tmp/release-gates.json             --slurpfile pr /tmp/release-pr.json             --slurpfile work /tmp/release-work-item.json             '{now:$now,gates:$gates[0],pr:$pr[0],work_issue:$work[0]}'             > /tmp/release-window-input.json

          python3 scripts/release_window.py pr-check             < /tmp/release-window-input.json             | tee /tmp/release-window-result.json

  coordinacion:
    name: Validar coordinación
    needs: [release_window]
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar reserva, rama y colisiones
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          argumentos=()
          if git cat-file -e "$BASE_SHA:.github/workflows/coordinacion-trabajo.yml" 2>/dev/null; then argumentos+=(--require-reservation); fi
          state="$(gh api "repos/$REPOSITORIO/pulls/$PR" --jq '.state')"
          case "$state" in
            open) ;;
            closed)
              echo "::notice::PR #$PR ya está cerrado en estado live; se omite validación de lease terminal."
              exit 0
              ;;
            *) echo "::error::Estado live inesperado para PR #$PR: $state"; exit 1 ;;
          esac
          python3 scripts/coordinar_trabajo.py validar-pr --repo "$REPOSITORIO" --pr "$PR" "${argumentos[@]}"

  acceptance:
    name: Criterios de aceptación
    needs: [workflows, scripts, coordinacion]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      checks: read
      pull-requests: read
    steps:
      - name: Exigir gates base del mismo run
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for r in $RESULTADOS; do
            [[ "$r" == "success" ]] || { echo "::error::Gate previo con resultado $r"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Construir evidencia del Issue y SHA
        id: acceptance_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$REPOSITORIO/pulls/$PR" --jq '.state')"
          case "$state" in
            open) echo "is_open=true" >> "$GITHUB_OUTPUT" ;;
            closed)
              echo "is_open=false" >> "$GITHUB_OUTPUT"
              echo "::notice::PR #$PR ya está cerrado en estado live; se omite evidencia de aceptación ligada a lease."
              exit 0
              ;;
            *) echo "::error::Estado live inesperado para PR #$PR: $state"; exit 1 ;;
          esac
          [[ "$HEAD_REF" =~ ^trabajo/issue-([1-9][0-9]*)$ ]] || { echo "::error::Rama sin Issue canónico"; exit 1; }
          issue="${BASH_REMATCH[1]}"
          gh api "repos/$REPOSITORIO/issues/$issue" > /tmp/issue.json
          gh api "repos/$REPOSITORIO/issues/$issue/comments?per_page=100" --paginate --slurp > /tmp/comments-pages.json
          python3 - <<'PY' > /tmp/acceptance-pin.json
          import json
          from scripts.coordinar_trabajo import latest_reservation

          pages = json.load(open("/tmp/comments-pages.json", encoding="utf-8"))
          comments = [
              comment
              for page in pages
              if isinstance(page, list)
              for comment in page
          ]
          reservation = latest_reservation(comments)
          pin = (
              reservation.get("acceptance_sha256")
              if isinstance(reservation, dict)
              else None
          )
          print(json.dumps(pin))
          PY
          gh api "repos/$REPOSITORIO/commits/$SHA/check-runs?per_page=100" > /tmp/checks.json
          jq -n \
            --slurpfile issue /tmp/issue.json \
            --slurpfile checks /tmp/checks.json \
            --slurpfile pin /tmp/acceptance-pin.json \
            '{issue:$issue[0], checks:$checks[0], acceptance_sha256:$pin[0], require_pin:true}' \
            > /tmp/acceptance.json

      - name: Verificar criterios específicos
        if: steps.acceptance_evidence.outputs.is_open == 'true'
        run: |
          set -euo pipefail
          python3 scripts/aceptacion_kit.py < /tmp/acceptance.json             | tee /tmp/acceptance-result.json
          {
            printf '### Criterios de aceptación\n\n```json\n'
            cat /tmp/acceptance-result.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  validar:
    name: Validar
    needs: [workflows, scripts, coordinacion, acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for r in $RESULTADOS; do case "$r" in success|skipped) ;; *) echo "::error::Gate con resultado $r"; exit 1 ;; esac; done
