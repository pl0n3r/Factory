name: Release reusable
on:
  workflow_call:
    inputs:
      version_source:
        required: true
        type: string
      version_format:
        required: false
        default: 'auto'
        type: string
      version_key:
        required: false
        default: 'version'
        type: string
      factory_bootstrap:
        required: false
        default: false
        type: boolean
      expected_sha:
        required: false
        default: ''
        type: string
    outputs:
      version:
        description: Versión X.Y.Z
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: Tag vX.Y.Z
        value: ${{ jobs.release.outputs.tag }}
      release_url:
        description: URL del GitHub Release
        value: ${{ jobs.release.outputs.release_url }}
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false
jobs:
  release:
    name: Asegurar tag y GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - name: Validar contexto confiable
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          BOOTSTRAP: ${{ inputs.factory_bootstrap }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              [[ "$BOOTSTRAP" == "false" ]] || { echo "::error::factory_bootstrap no aplica a push"; exit 1; }
              ;;
            workflow_dispatch)
              REPOSITORY="${REPOSITORY,,}"
              [[ "$BOOTSTRAP" == "true" ]] || { echo "::error::Dispatch sin factory_bootstrap"; exit 1; }
              [[ "$REPOSITORY" == "pl0n3r/factory" ]] || { echo "::error::Bootstrap solo permitido en Factory"; exit 1; }
              [[ "$ACTOR" == "$OWNER" ]] || { echo "::error::Bootstrap requiere al dueño"; exit 1; }
              [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha inválido"; exit 1; }
              [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "::error::expected_sha no coincide con github.sha"; exit 1; }
              ;;
            *) echo "::error::Release no acepta contexto $EVENT_NAME"; exit 1 ;;
          esac
          [[ "$REF_NAME" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "::error::Release solo acepta la rama principal"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - id: version
        uses: ./.factory/actions/read-version
        with:
          source: ${{ inputs.version_source }}
          format: ${{ inputs.version_format }}
          key: ${{ inputs.version_key }}
      - name: Asegurar tag anotado
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BOOTSTRAP: ${{ inputs.factory_bootstrap }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          # RELEASE_EXACT_MAIN_TAG_GUARD_BEGIN
          verify_remote_main() {
            local remote_sha
            if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::SHA candidato inválido antes de publicar"
              exit 1
            fi
            if [[ "$BOOTSTRAP" == "true" && "$EXPECTED_SHA" != "$TARGET_SHA" ]]; then
              echo "::error::SHA de bootstrap no coincide con candidato"
              exit 1
            fi
            remote_sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
            if [[ ! "$remote_sha" =~ ^[0-9a-f]{40}$ || "$remote_sha" != "$TARGET_SHA" ]]; then
              echo "::error::main cambió antes de publicar tag/release"
              exit 1
            fi
          }
          # RELEASE_EXACT_MAIN_TAG_GUARD_END
          verify_remote_main
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git cat-file -t "refs/tags/$TAG")" == "tag" ]] || { echo "::error::$TAG no es anotado"; exit 1; }
            existing_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
            [[ "$existing_sha" == "$TARGET_SHA" ]] || { echo "::error::$TAG ya apunta a otro commit"; exit 1; }
            exit 0
          fi
          object="$(gh api --method POST "repos/$REPOSITORY/git/tags" -f tag="$TAG" -f message="Release $TAG — $TARGET_SHA" -f object="$TARGET_SHA" -f type=commit --jq '.sha')"
          verify_remote_main
          if response="$(gh api --include --silent --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" 2>&1)"; then
            exit 0
          fi
          if ! grep -Eq '^HTTP/[0-9.]+[[:space:]]+(409|422)([[:space:]]|$)' <<<"$response"; then printf '%s\n' "$response" >&2; exit 1; fi
          ref_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          ref_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          [[ "$ref_type" == "tag" ]] || { echo "::error::Carrera creó tag no anotado"; exit 1; }
          race_sha="$(gh api "repos/$REPOSITORY/git/tags/$ref_object" --jq '.object.sha')"
          [[ "$race_sha" == "$TARGET_SHA" ]] || { echo "::error::Carrera creó $TAG para otro SHA"; exit 1; }
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BOOTSTRAP: ${{ inputs.factory_bootstrap }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          # RELEASE_EXACT_MAIN_RELEASE_GUARD_BEGIN
          verify_remote_main() {
            local remote_sha
            if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::SHA candidato inválido antes de publicar"
              exit 1
            fi
            if [[ "$BOOTSTRAP" == "true" && "$EXPECTED_SHA" != "$TARGET_SHA" ]]; then
              echo "::error::SHA de bootstrap no coincide con candidato"
              exit 1
            fi
            remote_sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
            if [[ ! "$remote_sha" =~ ^[0-9a-f]{40}$ || "$remote_sha" != "$TARGET_SHA" ]]; then
              echo "::error::main cambió antes de publicar tag/release"
              exit 1
            fi
          }
          # RELEASE_EXACT_MAIN_RELEASE_GUARD_END
          # RELEASE_REMOTE_TAG_GUARD_BEGIN
          verify_remote_tag() {
            local object_sha actual_sha
            object_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object | select(.type == "tag") | .sha')"
            if [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Tag remoto ausente, ligero o inválido"
              exit 1
            fi
            actual_sha="$(gh api "repos/$REPOSITORY/git/tags/$object_sha" --jq '.object | select(.type == "commit") | .sha')"
            if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
              echo "::error::Tag remoto no apunta al SHA aprobado"
              exit 1
            fi
          }
          # RELEASE_REMOTE_TAG_GUARD_END
          verify_remote_main
          # RELEASE_STATUS_EXACT_GUARD_BEGIN
          # Probe the authenticated REST endpoint: errors are not evidence of absence.
          probe_rc=0
          probe="$(gh api --include --silent "repos/$REPOSITORY/releases/tags/$TAG" 2>&1)" || probe_rc=$?
          status_lines="$(grep -E '^HTTP/[0-9.]+[[:space:]]+[0-9]{3}([[:space:]]|$)' <<< "$probe" || true)"
          if [[ "$(grep -c '^HTTP/' <<< "$status_lines")" != "1" ]]; then
            echo "::error::Consulta de Release sin estado HTTP inequívoco"
            exit 1
          fi
          if (( probe_rc == 0 )) && grep -Eq '^HTTP/[0-9.]+[[:space:]]+200([[:space:]]|$)' <<< "$status_lines"; then
            url="$(gh release view "$TAG" --repo "$REPOSITORY" --json url --jq '.url')"
            [[ -n "$url" ]] || { echo "::error::Release existente sin URL válida"; exit 1; }
          elif (( probe_rc != 0 )) && grep -Eq '^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$)' <<< "$status_lines"; then
            verify_remote_main
            verify_remote_tag
            gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "Release $TAG (V $VERSION)" --generate-notes
            url="$(gh release view "$TAG" --repo "$REPOSITORY" --json url --jq '.url')"
            [[ -n "$url" ]] || { echo "::error::Release creado sin URL verificable"; exit 1; }
          else
            echo "::error::Consulta de Release falló o retornó estado distinto de 200/404"
            exit 1
          fi
          # RELEASE_STATUS_EXACT_GUARD_END
          echo "url=$url" >> "$GITHUB_OUTPUT"
