name: Orquestador de fábrica

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      epic:
        description: Número de Issue épico
        required: false
        type: number
      offline_dispatch:
        description: 'Solo propuesta offline V2; nunca publica ni ejecuta'
        required: false
        default: false
        type: boolean
      offline_snapshot_json:
        description: 'JSON sintético de siete repos con policy_sha del checkout'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: orquestador-${{ github.event.issue.number || inputs.epic }}
  cancel-in-progress: false

jobs:
  planificar:
    permissions:
      contents: read
      issues: write
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.offline_dispatch != true) ||
      (
        github.event.issue.pull_request == null &&
        github.event.comment.body == '/planificar' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar orquestador canónico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Materializar plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          EPIC_EVENTO: ${{ github.event.issue.number }}
          EPIC_MANUAL: ${{ inputs.epic }}
        run: |
          set -euo pipefail
          epic="$EPIC_EVENTO"
          [[ -n "$epic" ]] || epic="$EPIC_MANUAL"
          [[ "$epic" =~ ^[1-9][0-9]*$ ]] || { echo "::error::epic inválido"; exit 1; }
          python3 scripts/orquestar_fabrica.py sync --repo "$REPOSITORIO" --epic "$epic"


  proponer-offline:
    name: Selector V2 offline (sin envío)
    if: github.event_name == 'workflow_dispatch' && inputs.offline_dispatch == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar política exacta del evento
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Proponer una orden offline (no publicar ni ejecutar)
        env:
          OFFLINE_SNAPSHOT_JSON: ${{ inputs.offline_snapshot_json }}
        run: |
          set -euo pipefail
          printf '%s' "$OFFLINE_SNAPSHOT_JSON" | python3 scripts/unattended_cycle_cli.py --dispatch-offline
