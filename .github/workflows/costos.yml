name: Control de costos

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions: {}

concurrency:
  group: costos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar-candidato:
    name: Validar candidato de costos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Descargar candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ejecutar regresiones
        run: |
          set -euo pipefail
          python3 -m py_compile metricas/costos.py
          PYTHONPATH=metricas python3 -m unittest discover -s metricas -p 'test_costos.py'

  presupuesto-pr:
    name: Presupuesto del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Descargar base confiable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Detectar disponibilidad del control en base confiable
        id: base
        run: |
          set -euo pipefail
          if [[ -f metricas/costos.py && -f metricas/presupuestos.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            mkdir -p artifacts
            printf '%s\n' '{"schema_version":1,"status":"bootstrap-not-enforced","reasons":["trusted-base-without-cost-control"]}' > artifacts/presupuesto-pr.json
            {
              echo "# Presupuesto de tarea / PR"
              echo
              echo "- Estado: **bootstrap-not-enforced**"
              echo "- Razón: la base confiable todavía no contiene el control de costos; no se informa un falso ok."
            } > artifacts/presupuesto-pr.md
            cat artifacts/presupuesto-pr.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validar control de costos
        if: steps.base.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile metricas/costos.py
          PYTHONPATH=metricas python3 -m unittest discover -s metricas -p 'test_costos.py'

      - name: Evaluar presupuesto
        if: steps.base.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if grep -q '^STDIN_SENTINEL = "-"' metricas/costos.py; then
            python3 metricas/costos.py pr \
              --event - \
              --budgets metricas/presupuestos.json \
              --json-out artifacts/presupuesto-pr.json \
              --markdown-out artifacts/presupuesto-pr.md < "$GITHUB_EVENT_PATH"
          else
            python3 metricas/costos.py pr \
              --event "$GITHUB_EVENT_PATH" \
              --budgets metricas/presupuestos.json \
              --json-out artifacts/presupuesto-pr.json \
              --markdown-out artifacts/presupuesto-pr.md
          fi
          cat artifacts/presupuesto-pr.md >> "$GITHUB_STEP_SUMMARY"
          status="$(python3 -c 'import json; print(json.load(open("artifacts/presupuesto-pr.json"))["status"])')"
          if [[ "$status" == "warning" || "$status" == "soft-block" ]]; then
            echo "::warning::Control de costos: $status. Revisa el Job Summary antes de integrar."
          fi

      - name: Conservar evidencia
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: presupuesto-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            artifacts/presupuesto-pr.json
            artifacts/presupuesto-pr.md
          retention-days: 30
          if-no-files-found: error

