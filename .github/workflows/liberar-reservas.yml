name: Auditoría de reservas inactivas (solo lectura)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/liberar-reservas.yml'
      - 'scripts/lease_auto_release.py'
      - 'tests/test_lease_auto_release.py'
      - 'docs/liberacion-automatica-de-reservas.md'
      - 'scripts/lease_auto_release_run.py'
      - 'scripts/lease_github_port.py'
      - 'tests/test_lease_auto_release_run.py'
      - 'tests/test_lease_github_port.py'
      - 'scripts/coordinar_trabajo.py'
      # Imports transitivos que pueden cambiar el contrato del observador.
      - 'scripts/lease_activity_collector.py'
      - 'tests/test_lease_activity_collector.py'
      - 'scripts/lease_release_executor.py'
      - 'tests/test_lease_release_executor.py'
      - 'scripts/unattended_kill_switch.py'
      - 'tests/test_unattended_kill_switch.py'
      - 'scripts/lease_auto_release_integration.py'
      - 'tests/test_lease_auto_release_integration.py'
      - 'tests/test_lease_auto_release_workflow.py'

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  # Solo schedule/dispatch comparten exclusión con Coordinación;
  # cada PR usa un grupo separado para no bloquear comandos /tomar.
  group: ${{ github.event_name == 'pull_request' && format('factory-lease-audit-pr-{0}', github.event.pull_request.number) || format('factory-coordination-{0}', github.repository_id) }}
  cancel-in-progress: false

jobs:
  validar-decisor:
    name: Simular política de reservas (sin mutación)
    if: >-
      github.repository == 'pl0n3r/Factory' &&
      (github.event_name == 'pull_request' ||
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preflight autenticado de cuota API (no publica datos privados)
        # Un PR verifica el código offline, no ejecuta auditorías vivas:
        # reservar las consultas autenticadas para schedule/dispatch en main.
        if: github.event_name != 'pull_request'
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: pl0n3r/Factory
          OBSERVED_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OBSERVED_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
            echo "::error::Repositorio no autorizado."
            exit 1
          }
          gh api /rate_limit > "$RUNNER_TEMP/lease-rate.json"
          jq -e '
            .resources.core as $core
            | ($core.limit | type) == "number"
              and ($core.remaining | type) == "number"
              and ($core.limit | floor) == $core.limit
              and ($core.remaining | floor) == $core.remaining
              and ($core.limit <= 1000000000)
              and ($core.limit > 0)
              and ($core.remaining >= 0)
              and ($core.remaining <= $core.limit)
          ' "$RUNNER_TEMP/lease-rate.json" >/dev/null || {
            echo "::error::Cuota desconocida o incongruente: fail-closed."
            exit 1
          }
          remaining="$(jq -r '.resources.core.remaining' "$RUNNER_TEMP/lease-rate.json")"
          limit="$(jq -r '.resources.core.limit' "$RUNNER_TEMP/lease-rate.json")"
          if (( remaining * 5 < limit )); then
            # Cuota baja no es error del workflow: sin GET adicionales ni mutaciones.
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deferred_low_quota: API inferior al 20%; 0 observaciones y 0 liberaciones."
            {
              echo "### Auditoría V3: deferred_low_quota"
              echo "Presupuesto API insuficiente; ejecución aplazada."
              echo "Observaciones=0; escrituras=0; liberaciones=0."
            } >> "$GITHUB_STEP_SUMMARY"
            # Identificar los ciclos aplazados sin consultas REST adicionales.
            # Un run verde por cuota nunca certifica observación de Fase A.
            jq -nc --arg repository "$OBSERVED_REPOSITORY" \
              --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" '
              {schema_version: 1, repository: $repository,
               head_sha: $sha, run_id: $run_id,
               status: "deferred_low_quota",
               terminal_certified: false, release_authorized: false,
               mutations: 0, valid_observations: 0,
               unknown_observations: 0, issues: []}
            ' > "$RUNNER_TEMP/lease-audit-evidence.json"
            exit 0
          fi
          echo "allow=true" >> "$GITHUB_OUTPUT"

      - name: Tests deterministas del decisor (read-only)
        # Deben ejecutarse en PR aun con GitHub App en 403/rate-limit.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_lease_auto_release.py' -v
          echo "AUDITORÍA SOLAMENTE: 0 reservas liberadas, 0 etiquetas modificadas."
          echo "No se concede autoridad a acciones mark_recovery/release."

      - name: Contrato de integración V3 (fakes sin API mutante)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_lease_auto_release_integration.py' -v
          python3 -m unittest discover -s tests -p 'test_lease_auto_release_workflow.py' -v
          echo "Integración verificada sólo con fakes; auto-release real permanece OFF."

      - name: Confirmar runner OFF sin transporte ni mutaciones
        # La puerta OFF se comprueba siempre y no requiere llamadas REST.
        shell: bash
        env:
          FACTORY_LEASE_AUTO_RELEASE_ENABLED: 'false'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.lease_auto_release_run import run_cycle

          class NoAccessPort:
              def __getattr__(self, name):
                  raise AssertionError("disabled runner must not access Port")

          cycle = run_cycle([1175], NoAccessPort())
          assert cycle.state == "feature_disabled"
          assert len(cycle.results) == 1
          assert cycle.results[0][1].wrote is False
          print("AUDITORÍA OFFLINE: flag OFF, 0 escrituras, 0 reservas liberadas.")
          PY

      - name: Inventario observado de recuperación (GET paginado, solo lectura)
        if: steps.budget.outputs.allow == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/pl0n3r/Factory/issues/767" > "$RUNNER_TEMP/lease-switch.json"
          verdict="$(python3 - "$RUNNER_TEMP/lease-switch.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.unattended_kill_switch import evaluate_unattended_kill_switch
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (type(payload) is not dict or payload.get("state") != "closed"
                  or type(payload.get("number")) is not int):
              print("UNKNOWN")
          else:
              print(evaluate_unattended_kill_switch(payload).state)
          PY
          )"
          case "$verdict" in
            RUNNING) ;;
            PAUSED)
              echo "Auditoría pausada por #767; 0 mutaciones y sin censo."
              exit 0
              ;;
            *)
              echo "::error::Fuente #767 no autenticada; censo UNKNOWN."
              exit 1
              ;;
          esac

          # /issues también incluye PRs: filtrarlos después de validar páginas.
          # El transporte y el archivo bruto permanecen en el runner; nunca
          # imprimir títulos, cuerpos, actores, notas ni token.
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "/repos/pl0n3r/Factory/issues?state=open&per_page=100" \
            > "$RUNNER_TEMP/lease-open-issues.json"
          # El primer RUNNING no es persistente: revalidar la fuente absoluta
          # después de paginar y ANTES de publicar siquiera el censo agregado.
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/pl0n3r/Factory/issues/767" > "$RUNNER_TEMP/lease-switch-after.json"
          python3 - "$RUNNER_TEMP/lease-switch.json" \
              "$RUNNER_TEMP/lease-switch-after.json" \
              "$RUNNER_TEMP/lease-open-issues.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.lease_auto_release_run import inventory_after_switch_recheck
          before = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          after = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          pages = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          result = inventory_after_switch_recheck(before, after, pages)
          if result is None or result.release_authorized:
              print("::error::Inventario de recuperación UNKNOWN, sin autoridad.")
              raise SystemExit(1)
          print("OBSERVACIÓN read-only: issues_abiertos={0}, recuperación={1}, "
                "reservados={2}, en_revisión={3}; liberaciones=0"
                .format(result.open_issues, result.recovery,
                        result.reserved, result.in_review))
          print("Sin prueba de inactividad, CAS ni autoridad de liberación.")
          PY

      - name: Observador integrado autenticado V3 (GET-only; sin autoridad de release)
        if: steps.budget.outputs.allow == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FACTORY_LEASE_AUTO_RELEASE_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          # El censo para decidir qué Issues observar también debe fallar
          # cerrado ante páginas/IDs duplicados, inventario truncado o pausa.
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/pl0n3r/Factory/issues/767" > "$RUNNER_TEMP/lease-observer-switch-before.json"
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "/repos/pl0n3r/Factory/issues?state=open&per_page=100" \
            > "$RUNNER_TEMP/lease-observer-issues.json"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/pl0n3r/Factory/issues/767" > "$RUNNER_TEMP/lease-observer-switch-after.json"
          python3 - "$RUNNER_TEMP/lease-observer-switch-before.json" \
              "$RUNNER_TEMP/lease-observer-switch-after.json" \
              "$RUNNER_TEMP/lease-observer-issues.json" \
              "$RUNNER_TEMP/lease-active-issues.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.lease_auto_release_run import inventory_after_switch_recheck

          before, after, source, destination = map(Path, sys.argv[1:])
          pages = json.loads(source.read_text(encoding="utf-8"))
          inventory = inventory_after_switch_recheck(
              json.loads(before.read_text(encoding="utf-8")),
              json.loads(after.read_text(encoding="utf-8")), pages,
          )
          if inventory is None or inventory.release_authorized:
              raise SystemExit("::error::Inventario V3 o kill switch UNKNOWN; no observar Issues.")
          managed = []
          for page in pages:
              for issue in page:
                  if "pull_request" in issue:
                      continue
                  names = {label["name"] for label in issue["labels"]}
                  if names & {"estado: reservado", "estado: en revisión",
                              "estado: requiere recuperación"}:
                      managed.append(issue["number"])
          # El censo validó páginas, IDs, labels y procedencia; no deduplicar
          # silenciosamente ni presentar una muestra como inventario completo.
          if len(managed) > 10:
              raise SystemExit("::error::Demasiados Issues V3; no observar parcialmente.")
          destination.write_text(
              json.dumps(sorted(managed), separators=(",", ":")), encoding="utf-8",
          )
          PY
          # Fallo de jq en sustitución de proceso no propaga su exit code
          # al while: materializar primero y validar con pasos sincrónicos.
          jq -e 'type == "array" and length <= 10 and
                 length == (unique | length) and
                 all(.[]; type == "number" and . > 0 and floor == .)' \
            "$RUNNER_TEMP/lease-active-issues.json" > /dev/null
          jq -r '.[]' "$RUNNER_TEMP/lease-active-issues.json" \
            > "$RUNNER_TEMP/lease-active-issue-numbers.txt"
          valid_observations=0
          unknown_observations=0
          : > "$RUNNER_TEMP/lease-observer-results.jsonl"
          while IFS= read -r issue_number; do
            [[ "$issue_number" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Inventario de Issues inválido; fail-closed."
              exit 1
            }
            # Jamás archivar stdout sin validar: podría contener datos
            # privados del transporte. Sólo exportar los seis campos
            # de diagnóstico y autoridades negativas del CLI.
            if python3 -m scripts.lease_auto_release_integration "$issue_number" \
                > "$RUNNER_TEMP/lease-observer-raw.json" &&
              # Un único documento por Issue: rechazar stdout con dos
              # objetos JSON aunque individualmente pasen la whitelist.
              jq -sce --argjson issue "$issue_number" '
                select(length == 1) | .[0]
                | select(type == "object"
                  and .issue == $issue and .state == "read_only"
                  and (.action == "wait" or .action == "mark_recovery"
                       or .action == "release")
                  and (.reason | type == "string"
                       and test("^[a-z][a-z0-9_]{0,79}$"))
                  and (.activity_source == null
                       or .activity_source == "reservation_marker"
                       or .activity_source == "workflow_push"
                       or .activity_source == "issue_comment"
                       or .activity_source == "repository_push")
                  and (.activity_age_minutes == null
                       or (.activity_age_minutes | type == "number"
                           and . >= 0 and floor == . and . <= 525600))
                  and .release_authorized == false
                  and .lock_verified == false
                  and .cas_verified == false and .mutations == 0)
                | {issue, state, action, reason,
                   activity_age_minutes, activity_source,
                   release_authorized, lock_verified, cas_verified, mutations}
              ' "$RUNNER_TEMP/lease-observer-raw.json" \
                >> "$RUNNER_TEMP/lease-observer-results.jsonl"; then
              valid_observations=$((valid_observations + 1))
            else
              unknown_observations=$((unknown_observations + 1))
              # Registro con datos mínimos, no repetir el JSON rechazado.
              printf '{"issue":%s,"state":"UNKNOWN","action":"unknown","reason":"unverifiable_observation","release_authorized":false,"lock_verified":false,"cas_verified":false,"mutations":0}\n' \
                "$issue_number" >> "$RUNNER_TEMP/lease-observer-results.jsonl"
              echo "::notice::Issue #${issue_number}: observación UNKNOWN o fallida (fail-closed, 0 mutaciones)."
            fi
          done < "$RUNNER_TEMP/lease-active-issue-numbers.txt"
          # Candidato de evidencia: jamás equivale a QA certificado.
          jq -sc --arg repo "${GITHUB_REPOSITORY:-UNKNOWN}" \
            --arg sha "${GITHUB_SHA:-UNKNOWN}" \
            --arg run_id "${GITHUB_RUN_ID:-UNKNOWN}" \
            --argjson valid "$valid_observations" \
            --argjson unknown "$unknown_observations" '
              . as $rows
              | if ($valid < 0 or $unknown < 0
                    or ($rows | length) != ($valid + $unknown)
                    or ($rows | map(.issue) | unique | length) != ($rows | length)
                    or ($rows | map(select(.state == "read_only")) | length) != $valid
                    or ($rows | map(select(.state == "UNKNOWN")) | length) != $unknown)
                then error("inconsistent_observation_inventory")
                else
                  {schema_version: 1, repository: $repo, head_sha: $sha,
                   run_id: $run_id, status:
                     (if $unknown > 0 or $valid == 0
                      then "UNKNOWN" else "candidate_terminal" end),
                   terminal_certified: false, release_authorized: false,
                   mutations: 0, valid_observations: $valid,
                   unknown_observations: $unknown, issues: $rows}
                end
            ' "$RUNNER_TEMP/lease-observer-results.jsonl" \
              > "$RUNNER_TEMP/lease-audit-evidence.json"
          {
            echo "### Observador V3 GET-only: resultado por Issue"
            echo "Observaciones válidas=${valid_observations}; UNKNOWN=${unknown_observations}; liberaciones=0."
            echo "Un run con UNKNOWN o censo vacío no acredita un ciclo válido de Fase A."
            echo "El manifiesto del run es solo candidato; QA y procedencia deben verificarlo."
            echo
            echo "| Issue | Estado | Decisión | Inactividad (min) | Fuente | Veto/motivo |"
            echo "| --- | --- | --- | ---: | --- | --- |"
            # Sólo el manifiesto saneado, nunca stdout REST/CLI: todos los
            # valores visibles están validados o sintetizados en el censo.
            jq -r '.issues[] |
              "| #\(.issue) | \(.state) | \(.action) | \(.activity_age_minutes // "UNKNOWN") | \(.activity_source // "UNKNOWN") | \(.reason) |"
            ' "$RUNNER_TEMP/lease-audit-evidence.json"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( unknown_observations > 0 )); then
            echo "::error::Censo incompleto: ${unknown_observations} observaciones UNKNOWN; ciclo NO acreditable."
            exit 1
          fi

      - name: Conservar evidencia acotada del observador (no certifica ciclos)
        # Sólo el cron sobre main; no se archivan tokens ni respuestas REST.
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lease-observer-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lease-audit-evidence.json
          if-no-files-found: warn
          retention-days: 7
