name: Observar reusable
on:
  workflow_call:
    inputs:
      domain: {required: true, type: string}
      health_path: {required: false, default: '/health', type: string}
      paths: {required: false, default: '["/"]', type: string}
      version_source: {required: true, type: string}
      version_format: {required: false, default: 'auto', type: string}
      version_key: {required: false, default: 'version', type: string}
      expected_sha: {required: false, default: '', type: string}
      require_schema: {required: false, default: false, type: boolean}
permissions:
  contents: read
  issues: write
jobs:
  observar:
    name: Smoke producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar contexto confiable
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in schedule|workflow_dispatch) ;; *) echo "::error::Observación solo acepta schedule/workflow_dispatch"; exit 1 ;; esac
          [[ "$REF_NAME" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "::error::Observación solo acepta la rama principal"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - id: version
        uses: ./.factory/actions/read-version
        with:
          source: ${{ inputs.version_source }}
          format: ${{ inputs.version_format }}
          key: ${{ inputs.version_key }}
      - id: smoke
        env:
          DOMAIN: ${{ inputs.domain }}
          HEALTH_PATH: ${{ inputs.health_path }}
          PATHS: ${{ inputs.paths }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUIRE_SCHEMA: ${{ inputs.require_schema }}
        run: |
          set -euo pipefail
          sha="$EXPECTED_SHA"; [[ -n "$sha" ]] || sha="$GITHUB_SHA"
          args=(--origin "$DOMAIN" --health-path "$HEALTH_PATH" --version "$VERSION" --sha "$sha" --paths "$PATHS")
          [[ "$REQUIRE_SCHEMA" == "true" ]] && args+=(--require-schema)
          set +e
          python3 .factory/scripts/observe_kit.py "${args[@]}" > /tmp/factory-observation.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Gestionar incidente automático
        if: always() && steps.smoke.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULT_CODE: ${{ steps.smoke.outputs.code }}
        run: |
          set -euo pipefail
          marker='<!-- factory-auto-observer -->'
          gh api --paginate "repos/$REPOSITORY/issues?state=open&per_page=100" --jq '.[] | @json' > /tmp/open.ndjson
          issue="$(python3 -c 'import json,sys; m=sys.argv[1]; ds=(json.loads(x) for x in open(sys.argv[2],encoding="utf-8")); print(next((str(d.get("number","")) for d in ds if (d.get("user") or {}).get("login")=="github-actions[bot]" and isinstance(d.get("body"),str) and m in d["body"].splitlines()),""))' "$marker" /tmp/open.ndjson)"
          if [[ "$RESULT_CODE" == "0" ]]; then
            if [[ -n "$issue" ]]; then gh issue close "$issue" --repo "$REPOSITORY" --comment "🟢 Observación recuperada." >/dev/null; fi
            exit 0
          fi
          detail="$(python3 -c 'import json; print(json.load(open("/tmp/factory-observation.json")).get("error","Fallo de observación"))')"
          body="$marker"$'\n'"Observación automática falló sin mutar producción."$'\n\n'"Detalle sanitizado: $detail"
          if [[ -n "$issue" ]]; then gh issue comment "$issue" --repo "$REPOSITORY" --body "$body" >/dev/null; else gh issue create --repo "$REPOSITORY" --title "[AUTO] fallo de observación" --label "tipo: incidente" --label "prioridad: crítica" --label "estado: disponible" --body "$body" >/dev/null; fi
          exit 1
