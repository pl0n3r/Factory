name: Observar reusable
on:
  workflow_call:
    inputs:
      domain: {required: true, type: string}
      health_path: {required: false, default: '/health', type: string}
      paths: {required: false, default: '["/"]', type: string}
      version_source: {required: true, type: string}
      version_format: {required: false, default: 'auto', type: string}
      version_key: {required: false, default: 'version', type: string}
      expected_sha: {required: false, default: '', type: string}
      require_schema: {required: false, default: false, type: boolean}
      label_language: {required: false, default: 'es', type: string}
      convergence_attempts: {required: false, default: 1, type: number}
      convergence_delay_seconds: {required: false, default: 0, type: number}
permissions:
  contents: read

concurrency:
  group: observe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observar:
    name: Smoke producción
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar contexto confiable
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LABEL_LANGUAGE: ${{ inputs.label_language }}
          CONVERGENCE_ATTEMPTS: ${{ inputs.convergence_attempts }}
          CONVERGENCE_DELAY_SECONDS: ${{ inputs.convergence_delay_seconds }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in push|schedule|workflow_dispatch) ;; *) echo "::error::Observación solo acepta push/schedule/workflow_dispatch"; exit 1 ;; esac
          case "$LABEL_LANGUAGE" in es|en) ;; *) echo "::error::label_language inválido"; exit 1 ;; esac
          case "$CONVERGENCE_ATTEMPTS" in 1|2|3|4|5) ;; *) echo "::error::convergence_attempts debe ser entero 1..5"; exit 1 ;; esac
          [[ "$CONVERGENCE_DELAY_SECONDS" =~ ^[0-9]+$ ]] || { echo "::error::convergence_delay_seconds debe ser entero 0..120"; exit 1; }
          convergence_delay=$((10#$CONVERGENCE_DELAY_SECONDS))
          (( convergence_delay <= 120 )) || { echo "::error::convergence_delay_seconds debe ser entero 0..120"; exit 1; }
          [[ "$REF_NAME" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "::error::Observación solo acepta la rama principal"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - id: version
        uses: ./.factory/actions/read-version
        with:
          source: ${{ inputs.version_source }}
          format: ${{ inputs.version_format }}
          key: ${{ inputs.version_key }}
      - id: smoke
        env:
          DOMAIN: ${{ inputs.domain }}
          HEALTH_PATH: ${{ inputs.health_path }}
          PATHS: ${{ inputs.paths }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUIRE_SCHEMA: ${{ inputs.require_schema }}
          CONVERGENCE_ATTEMPTS: ${{ inputs.convergence_attempts }}
          CONVERGENCE_DELAY_SECONDS: ${{ inputs.convergence_delay_seconds }}
        run: |
          set -euo pipefail
          sha="$EXPECTED_SHA"; [[ -n "$sha" ]] || sha="$GITHUB_SHA"
          args=(--origin "$DOMAIN" --health-path "$HEALTH_PATH" --version "$VERSION" --sha "$sha" --paths "$PATHS")
          [[ "$REQUIRE_SCHEMA" == "true" ]] && args+=(--require-schema)
          attempts="$CONVERGENCE_ATTEMPTS"
          delay_seconds="$CONVERGENCE_DELAY_SECONDS"
          code=1
          for ((attempt=1; attempt<=attempts; attempt++)); do
            set +e
            python3 .factory/scripts/observe_kit.py "${args[@]}" > /tmp/factory-observation.json
            code=$?
            set -e
            [[ "$code" -eq 0 ]] && break
            if (( attempt < attempts )); then
              echo "::notice::Observación no convergió en intento $attempt/$attempts; reintento en ${delay_seconds}s"
              sleep "$delay_seconds"
            fi
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Gestionar incidente automático
        if: always() && steps.smoke.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULT_CODE: ${{ steps.smoke.outputs.code }}
          LABEL_LANGUAGE: ${{ inputs.label_language }}
        run: |
          set -euo pipefail
          marker='<!-- factory-auto-observer -->'
          catalog=".factory/labels/$LABEL_LANGUAGE.json"

          label_by_key() {
            jq -er --arg key "$1" '
              [.[] | select(.key == $key) | .name]
              | if length == 1 then .[0] else error("label key inválida") end
            ' "$catalog"
          }

          incident_label="$(label_by_key type_incident)"
          priority_label="$(label_by_key priority_critical)"
          state_label="$(label_by_key state_available)"

          case "$LABEL_LANGUAGE" in
            es)
              title="[AUTO] fallo de observación"
              failure_message="Observación automática falló sin mutar producción."
              detail_prefix="Detalle sanitizado:"
              recovered_message="🟢 Observación recuperada."
              default_detail="Fallo de observación"
              ;;
            en)
              title="[AUTO] observation failure"
              failure_message="Automatic observation failed without mutating production."
              detail_prefix="Sanitized detail:"
              recovered_message="🟢 Observation recovered."
              default_detail="Observation failed"
              ;;
          esac

          gh api --paginate "repos/$REPOSITORY/issues?state=all&per_page=100" --jq '.[] | @json' > /tmp/all.ndjson

          # La recuperación solo cierra el incidente abierto; nunca muta uno histórico.
          open_issue="$(jq -sr --arg marker "$marker" '
            map(select(
              (.user.login // "") == "github-actions[bot]"
              and ((.body // "") | split("\n") | index($marker))
              and .state == "open"
            ))
            | sort_by(.number) | first | .number // ""
          ' /tmp/all.ndjson)"
          if [[ "$RESULT_CODE" == "0" ]]; then
            if [[ -n "$open_issue" ]]; then
              gh issue close "$open_issue" --repo "$REPOSITORY" --comment "$recovered_message" >/dev/null
            fi
            exit 0
          fi

          issue="$open_issue"
          issue_state=""
          obsolete_issue=""
          if [[ -n "$issue" ]]; then
            issue_state="open"
          else
            # Solo es reutilizable un issue cerrado por el propio observador.
            # state_reason=not_planned prevalece incluso si lo cerró el bot.
            jq -sr --arg marker "$marker" '
              map(select(
                (.user.login // "") == "github-actions[bot]"
                and ((.body // "") | split("\n") | index($marker))
                and .state == "closed"
              ))
              | sort_by(.number) | .[]
              | [.number, (.state_reason // "unknown")] | @tsv
            ' /tmp/all.ndjson > /tmp/observer-closed.tsv
            while IFS=$'\t' read -r candidate reason; do
              [[ -n "$candidate" ]] || continue
              if [[ "$reason" == "not_planned" ]]; then
                [[ -n "$obsolete_issue" ]] || obsolete_issue="$candidate"
                continue
              fi
              # El último evento "closed" es autoritativo; el creador del issue
              # no acredita quién lo cerró. Un historial ausente no da permiso.
              last_closer="$(gh api --paginate "repos/$REPOSITORY/issues/$candidate/timeline?per_page=100" --jq '.[] | @json' |
                jq -sr '[.[] | select(.event == "closed")] | last | .actor.login // ""')"
              if [[ "$last_closer" == "github-actions[bot]" ]]; then
                issue="$candidate"
                issue_state="closed"
                break
              fi
              [[ -n "$obsolete_issue" ]] || obsolete_issue="$candidate"
            done < /tmp/observer-closed.tsv
          fi

          detail="$(python3 -c 'import json,sys; print(json.load(open("/tmp/factory-observation.json")).get("error",sys.argv[1]))' "$default_detail")"
          printf -v body '%s\n%s\n\n%s %s' "$marker" "$failure_message" "$detail_prefix" "$detail"
          if [[ -z "$issue" && -n "$obsolete_issue" ]]; then
            case "$LABEL_LANGUAGE" in
              es) obsolete_note="Histórico cerrado respetado: #$obsolete_issue." ;;
              en) obsolete_note="Previously closed incident respected: #$obsolete_issue." ;;
            esac
            printf -v body '%s\n\n%s' "$body" "$obsolete_note"
          fi
          jq -n \
            --arg title "$title" \
            --arg body "$body" \
            --arg incident "$incident_label" \
            --arg priority "$priority_label" \
            --arg state "$state_label" \
            '{title:$title,body:$body,labels:[$incident,$priority,$state]}' > /tmp/incident-create.json

          if [[ -n "$issue" ]]; then
            if [[ "$issue_state" == "closed" ]]; then
              jq '. + {state:"open"}' /tmp/incident-create.json > /tmp/incident-update.json
              gh api --method PATCH "repos/$REPOSITORY/issues/$issue" --input /tmp/incident-update.json >/dev/null
            fi
            gh issue comment "$issue" --repo "$REPOSITORY" --body "$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues" --input /tmp/incident-create.json >/dev/null
          fi
          exit 1
