name: Observar reusable
on:
  workflow_call:
    inputs:
      domain: {required: true, type: string}
      health_path: {required: false, default: '/health', type: string}
      paths: {required: false, default: '["/"]', type: string}
      version_source: {required: true, type: string}
      version_format: {required: false, default: 'auto', type: string}
      version_key: {required: false, default: 'version', type: string}
      expected_sha: {required: false, default: '', type: string}
      require_schema: {required: false, default: false, type: boolean}
      label_language: {required: false, default: 'es', type: string}
permissions:
  contents: read

concurrency:
  group: observe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observar:
    name: Smoke producción
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar contexto confiable
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LABEL_LANGUAGE: ${{ inputs.label_language }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in schedule|workflow_dispatch) ;; *) echo "::error::Observación solo acepta schedule/workflow_dispatch"; exit 1 ;; esac
          case "$LABEL_LANGUAGE" in es|en) ;; *) echo "::error::label_language inválido"; exit 1 ;; esac
          [[ "$REF_NAME" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "::error::Observación solo acepta la rama principal"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - id: version
        uses: ./.factory/actions/read-version
        with:
          source: ${{ inputs.version_source }}
          format: ${{ inputs.version_format }}
          key: ${{ inputs.version_key }}
      - id: smoke
        env:
          DOMAIN: ${{ inputs.domain }}
          HEALTH_PATH: ${{ inputs.health_path }}
          PATHS: ${{ inputs.paths }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUIRE_SCHEMA: ${{ inputs.require_schema }}
        run: |
          set -euo pipefail
          sha="$EXPECTED_SHA"; [[ -n "$sha" ]] || sha="$GITHUB_SHA"
          args=(--origin "$DOMAIN" --health-path "$HEALTH_PATH" --version "$VERSION" --sha "$sha" --paths "$PATHS")
          [[ "$REQUIRE_SCHEMA" == "true" ]] && args+=(--require-schema)
          set +e
          python3 .factory/scripts/observe_kit.py "${args[@]}" > /tmp/factory-observation.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Gestionar incidente automático
        if: always() && steps.smoke.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULT_CODE: ${{ steps.smoke.outputs.code }}
          LABEL_LANGUAGE: ${{ inputs.label_language }}
        run: |
          set -euo pipefail
          marker='<!-- factory-auto-observer -->'
          catalog=".factory/labels/$LABEL_LANGUAGE.json"

          label_by_key() {
            jq -er --arg key "$1" '
              [.[] | select(.key == $key) | .name]
              | if length == 1 then .[0] else error("label key inválida") end
            ' "$catalog"
          }

          incident_label="$(label_by_key type_incident)"
          priority_label="$(label_by_key priority_critical)"
          state_label="$(label_by_key state_available)"

          case "$LABEL_LANGUAGE" in
            es)
              title="[AUTO] fallo de observación"
              failure_message="Observación automática falló sin mutar producción."
              detail_prefix="Detalle sanitizado:"
              recovered_message="🟢 Observación recuperada."
              default_detail="Fallo de observación"
              ;;
            en)
              title="[AUTO] observation failure"
              failure_message="Automatic observation failed without mutating production."
              detail_prefix="Sanitized detail:"
              recovered_message="🟢 Observation recovered."
              default_detail="Observation failed"
              ;;
          esac

          gh api --paginate "repos/$REPOSITORY/issues?state=all&per_page=100" --jq '.[] | @json' > /tmp/all.ndjson
          existing="$(jq -sr --arg marker "$marker" '
            map(select(
              (.user.login // "") == "github-actions[bot]"
              and ((.body // "") | split("\n") | index($marker))
            ))
            | sort_by((.state != "open"), .number)
            | first // null
            | if . == null then "" else [.number, .state] | @tsv end
          ' /tmp/all.ndjson)"
          issue=""
          issue_state=""
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r issue issue_state <<<"$existing"
          fi

          if [[ "$RESULT_CODE" == "0" ]]; then
            if [[ -n "$issue" && "$issue_state" == "open" ]]; then
              gh issue close "$issue" --repo "$REPOSITORY" --comment "$recovered_message" >/dev/null
            fi
            exit 0
          fi

          detail="$(python3 -c 'import json,sys; print(json.load(open("/tmp/factory-observation.json")).get("error",sys.argv[1]))' "$default_detail")"
          printf -v body '%s\n%s\n\n%s %s' "$marker" "$failure_message" "$detail_prefix" "$detail"
          jq -n \
            --arg title "$title" \
            --arg body "$body" \
            --arg incident "$incident_label" \
            --arg priority "$priority_label" \
            --arg state "$state_label" \
            '{title:$title,body:$body,labels:[$incident,$priority,$state]}' > /tmp/incident-create.json

          if [[ -n "$issue" ]]; then
            jq '. + {state:"open"}' /tmp/incident-create.json > /tmp/incident-update.json
            gh api --method PATCH "repos/$REPOSITORY/issues/$issue" --input /tmp/incident-update.json >/dev/null
            gh issue comment "$issue" --repo "$REPOSITORY" --body "$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues" --input /tmp/incident-create.json >/dev/null
          fi
          exit 1
