name: Release Factory v1.x

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA exacto de main o "latest" para resolver HEAD al lanzar
        required: true
        type: string
      gate_issue:
        description: Issue cerrado con la puerta humana de release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factory-release-bootstrap
  cancel-in-progress: false

jobs:
  candidate-template:
    name: CI template del candidato
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      stack: php
      working_directory: template
      version_source: config/version.json
      label_language: es
      phase: construccion
      kit_ref: ${{ github.sha }}
      factory_release_bootstrap: true

  preflight:
    name: Validar gates de release v1.x
    needs: [candidate-template, consumer-compat]
    permissions:
      actions: read
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.validate.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: validate
        name: Verificar SHA, Issues, puerta y v1
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_SHA_INPUT: ${{ inputs.expected_sha }}
          GATE_ISSUE: ${{ inputs.gate_issue }}
        run: |
          set -euo pipefail
          [[ "$GATE_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::gate_issue inválido"; exit 1; }

          default_sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
          expected_mode="exact"
          resolved_sha="$EXPECTED_SHA_INPUT"
          if [[ "$EXPECTED_SHA_INPUT" == "latest" ]]; then
            expected_mode="latest"
            resolved_sha="$default_sha"
          else
            [[ "$EXPECTED_SHA_INPUT" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "::error::expected_sha debe ser un SHA-1 de 40 hex o latest"
              exit 1
            }
            resolved_sha="${EXPECTED_SHA_INPUT,,}"
          fi
          [[ "$CURRENT_SHA" == "$resolved_sha" && "$default_sha" == "$resolved_sha" ]] || {
            echo "::error::main cambió durante el bootstrap; reejecuta sobre el HEAD vigente"
            exit 1
          }
          current_version="$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' config/version.json)"
          printf '[]\n' > /tmp/changed-files-since-gate.json
          printf '{}\n' > /tmp/exact-main-checks.json

          printf '{}\n' > /tmp/issues.json
          for number in {1..14} 54 83; do
            state="$(gh api "repos/$REPOSITORY/issues/$number" --jq '.state')"
            jq --arg number "$number" --arg state "$state"               '. + {($number): {"state": $state}}' /tmp/issues.json > /tmp/issues.next
            mv /tmp/issues.next /tmp/issues.json
          done

          gh api "repos/$REPOSITORY/issues/$GATE_ISSUE" > /tmp/gate.json
          gh api --paginate "repos/$REPOSITORY/issues/$GATE_ISSUE/comments?per_page=100"             --slurp | jq 'add // []' > /tmp/comments.json

          if [[ "$expected_mode" == "latest" ]]; then
            gate_sha="$(python3 - /tmp/gate.json <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              gate = json.load(handle)
          body = gate.get("body")
          if not isinstance(body, str):
              raise SystemExit("gate sin body")
          # SHA es hexadecimal case-insensitive; normalizar antes de contar valores.
          targets = {
              sha.lower()
              for sha in re.findall(r"\bmain@([0-9a-fA-F]{40})\b", body)
          }
          if len(targets) != 1:
              raise SystemExit("gate sin main@SHA único")
          print(next(iter(targets)))
          PY
            )"
            if [[ "$gate_sha" != "$resolved_sha" ]]; then
              gh api "repos/$REPOSITORY/compare/$gate_sha...$resolved_sha" > /tmp/gate-drift.json
              compare_status="$(jq -r '.status // ""' /tmp/gate-drift.json)"
              [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]] || {
                echo "::error::HEAD actual no desciende limpiamente del SHA de la puerta"
                exit 1
              }
              changed_count="$(jq '.files | length' /tmp/gate-drift.json)"
              (( changed_count < 300 )) || {
                echo "::error::diff de la puerta demasiado grande para validar deriva de forma segura"
                exit 1
              }
              jq '[.files[].filename]' /tmp/gate-drift.json > /tmp/changed-files-since-gate.json
            fi

            gh run list --commit "$resolved_sha" --limit 100 \
              --json name,status,conclusion,headSha > /tmp/exact-main-runs.json
            require_exact_main_success() {
              local workflow_name="$1"
              jq -e \
                --arg workflow_name "$workflow_name" \
                --arg sha "$resolved_sha" \
                'map(select(
                  .name == $workflow_name and
                  .headSha == $sha and
                  .status == "completed" and
                  .conclusion == "success"
                )) | length > 0' \
                /tmp/exact-main-runs.json >/dev/null || {
                  echo "::error::$workflow_name no tiene ejecución success sobre $resolved_sha"
                  exit 1
                }
            }
            require_exact_main_success "CI factory"
            require_exact_main_success "Sonar CI-based"
            require_exact_main_success "Evidencia CodeQL"
            require_exact_main_success "Unattended Watchdog"
            jq -n '{
              ci:"success",
              sonar:"success",
              codeql:"success",
              watchdog:"success"
            }' > /tmp/exact-main-checks.json
          fi

          extract_rearm_source() {
            python3 - "$1" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              issue = json.load(handle)
          body = issue.get("body")
          if not isinstance(body, str):
              raise SystemExit(0)
          matches = re.findall(
              r"<!--\s*factory-release-rearm\s+(\{[^\n]*\})\s*-->",
              body,
          )
          if len(matches) != 1:
              raise SystemExit(0)
          try:
              marker = json.loads(matches[0])
          except json.JSONDecodeError:
              raise SystemExit(0)
          source_issue = marker.get("source_issue") if isinstance(marker, dict) else None
          if type(source_issue) is int and source_issue > 0:
              print(source_issue)
          PY
          }

          printf '[]\n' > /tmp/rearm-sources.json
          source_issue="$(extract_rearm_source /tmp/gate.json)"
          for _depth in {1..8}; do
            [[ -n "$source_issue" ]] || break
            [[ "$source_issue" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::source_issue de rearmado inválido"
              exit 1
            }
            if jq -e --argjson number "$source_issue"               'map(.number) | index($number) != null'               /tmp/rearm-sources.json >/dev/null; then
              echo "::error::cadena factory-release-rearm cíclica"
              exit 1
            fi
            gh api "repos/$REPOSITORY/issues/$source_issue" > /tmp/rearm-source.json
            jq --slurpfile item /tmp/rearm-source.json               '. + [($item[0] | {
                number,
                state,
                author_association,
                created_at,
                user:{login:(.user.login // "")},
                body:(.body // "")
              })]' /tmp/rearm-sources.json > /tmp/rearm-sources.next
            mv /tmp/rearm-sources.next /tmp/rearm-sources.json

            source_login="$(jq -r '.user.login // ""' /tmp/rearm-source.json)"
            source_association="$(jq -r '.author_association // ""' /tmp/rearm-source.json)"
            if [[ "$source_login" == "$REPOSITORY_OWNER" && "$source_association" == "OWNER" ]]; then
              source_issue=""
              break
            fi
            source_issue="$(extract_rearm_source /tmp/rearm-source.json)"
          done
          [[ -z "$source_issue" ]] || {
            echo "::error::cadena factory-release-rearm excede 8 saltos"
            exit 1
          }

          gh api --paginate "repos/$REPOSITORY/rulesets?includes_parents=true&per_page=100"             --slurp | jq 'add // []' > /tmp/ruleset-index.json
          printf '[]\n' > /tmp/rulesets.json
          jq -r '.[].id' /tmp/ruleset-index.json | while IFS= read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::ruleset id inválido"
              exit 1
            }
            gh api "repos/$REPOSITORY/rulesets/$ruleset_id?includes_parents=true" > /tmp/ruleset.json
            jq --slurpfile item /tmp/ruleset.json '. + $item'               /tmp/rulesets.json > /tmp/rulesets.next
            mv /tmp/rulesets.next /tmp/rulesets.json
          done
          python3 scripts/verificar_ruleset_v1.py < /tmp/rulesets.json

          v1_sha=""
          ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/v1" 2>/dev/null || true)"
          if [[ -n "$ref_json" ]]; then
            ref_type="$(jq -r '.object.type' <<<"$ref_json")"
            ref_object="$(jq -r '.object.sha' <<<"$ref_json")"
            case "$ref_type" in
              commit) v1_sha="$ref_object" ;;
              tag) v1_sha="$(gh api "repos/$REPOSITORY/git/tags/$ref_object" --jq '.object.sha')" ;;
            esac
          fi

          v1_0_0_exists=false
          if response="$(gh api --include --silent "repos/$REPOSITORY/git/ref/tags/v1.0.0" 2>&1)"; then
            v1_0_0_exists=true
          elif grep -Eq '^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$)' <<<"$response"; then
            v1_0_0_exists=false
          else
            printf '%s\n' "$response" >&2
            echo "::error::No se pudo determinar si existe v1.0.0" >&2
            exit 1
          fi

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n             --arg repository "$REPOSITORY"             --arg repository_owner "$REPOSITORY_OWNER"             --arg actor "$ACTOR"             --arg event_name "$EVENT_NAME"             --arg ref "$REF_NAME"             --arg default_branch "$DEFAULT_BRANCH"             --arg expected_mode "$expected_mode"             --arg expected_sha "$resolved_sha"             --arg current_sha "$CURRENT_SHA"             --arg default_branch_sha "$default_sha"             --arg current_version "$current_version"             --arg v1_sha "$v1_sha"             --arg now "$now"             --argjson v1_0_0_exists "$v1_0_0_exists"             --slurpfile issues /tmp/issues.json             --slurpfile gate /tmp/gate.json             --slurpfile comments /tmp/comments.json             --slurpfile rearm_sources /tmp/rearm-sources.json             --slurpfile changed_files /tmp/changed-files-since-gate.json             --slurpfile exact_main_checks /tmp/exact-main-checks.json             '{
              repository:$repository, repository_owner:$repository_owner,
              actor:$actor, event_name:$event_name, ref:$ref,
              default_branch:$default_branch, expected_mode:$expected_mode,
              expected_sha:$expected_sha, current_sha:$current_sha,
              default_branch_sha:$default_branch_sha,
              current_version:$current_version,
              changed_files_since_gate:$changed_files[0],
              exact_main_checks:$exact_main_checks[0],
              v1_sha:$v1_sha, v1_0_0_exists:$v1_0_0_exists, now:$now,
              issues:$issues[0], rearm_sources:$rearm_sources[0],
              gate:{
                state:$gate[0].state,
                author_association:$gate[0].author_association,
                created_at:$gate[0].created_at,
                user:{login:($gate[0].user.login // "")},
                closed_by:($gate[0].closed_by.login // ""),
                body:($gate[0].body // ""),
                comments:($comments[0] | map({
                  author_association,
                  user:{login:(.user.login // "")},
                  body:(.body // "")
                }))
              }
            }' > /tmp/release-bootstrap.json

          python3 -m scripts.release_bootstrap < /tmp/release-bootstrap.json             | tee /tmp/release-bootstrap-result.json
          approved_sha="$(jq -r '.sha' /tmp/release-bootstrap-result.json)"
          echo "approved_sha=$approved_sha" >> "$GITHUB_OUTPUT"

  consumer-compat:
    name: Compatibilidad de consumidores
    needs: candidate-template
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verificar permission envelope de consumidores públicos
        env:
          FACTORY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$FACTORY_SHA" ]]
          python3 -m scripts.reusable_release_preflight --factory-sha "$FACTORY_SHA"
  release:
    name: Publicar release semántico desde v1
    needs: preflight
    permissions:
      contents: write
    uses: pl0n3r/factory/.github/workflows/release.yml@v1
    with:
      version_source: config/version.json
      version_format: json
      factory_bootstrap: true
      expected_sha: ${{ needs.preflight.outputs.approved_sha }}

  channel-ready:
    name: Verificar canal v1 antes del self-test
    needs: [preflight, release]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Exigir v1 en el SHA aprobado
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPROVED_SHA: ${{ needs.preflight.outputs.approved_sha }}
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/v1")"
          ref_type="$(jq -r '.object.type' <<<"$ref_json")"
          ref_object="$(jq -r '.object.sha' <<<"$ref_json")"
          case "$ref_type" in
            commit) v1_sha="$ref_object" ;;
            tag) v1_sha="$(gh api "repos/$REPOSITORY/git/tags/$ref_object" --jq '.object.sha')" ;;
            *) echo "::error::Factory@v1 tiene tipo inesperado $ref_type"; exit 1 ;;
          esac
          [[ "$v1_sha" == "$APPROVED_SHA" ]] || {
            echo "::error::Factory@v1 sigue en $v1_sha; mueve administrativamente v1 a $APPROVED_SHA y reejecuta este bootstrap."
            exit 1
          }

  selftest-published:
    name: Self-test del canal v1 publicado
    needs: channel-ready
    permissions:
      contents: read
    uses: pl0n3r/factory/.github/workflows/ci.yml@v1
    with:
      stack: php
      working_directory: template
      version_source: config/version.json
      label_language: es
      phase: construccion
      kit_ref: v1
      factory_release_bootstrap: true
