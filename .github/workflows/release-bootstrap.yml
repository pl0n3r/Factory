name: Release Factory v1.x

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA exacto de main aprobado para release v1.x
        required: true
        type: string
      gate_issue:
        description: Issue cerrado con la puerta humana de release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factory-release-bootstrap
  cancel-in-progress: false

jobs:
  candidate-template:
    name: CI template del candidato
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      stack: php
      working_directory: template
      version_source: config/version.json
      label_language: es
      phase: construccion
      kit_ref: ${{ github.sha }}
      factory_release_bootstrap: true

  consumer-compat:
    name: Compatibilidad de consumidores
    needs: candidate-template
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verificar permission envelope de consumidores públicos
        env:
          FACTORY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$FACTORY_SHA" ]] || {
            echo "::error::checkout no coincide con github.sha"
            exit 1
          }

          repositories=(
            pl0n3r/Condor
            pl0n3r/ControlBot
            pl0n3r/FactoryRunner
            pl0n3r/GrindFlow
            pl0n3r/brvtal
            pl0n3r/AutoFactory
          )
          jq -n --arg sha "$FACTORY_SHA" \
            '{version:1,factory_sha:$sha,consumers:[]}' \
            > /tmp/reusable-consumers.json

          for repository in "${repositories[@]}"; do
            repo_meta="$(curl --fail --silent --show-error --location --max-time 20 \
              "https://api.github.com/repos/$repository")"
            default_branch="$(jq -er '.default_branch | select(type == "string" and length > 0)' \
              <<<"$repo_meta")"
            head_json="$(curl --fail --silent --show-error --location --max-time 20 \
              "https://api.github.com/repos/$repository/commits/$default_branch")"
            repository_sha="$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' \
              <<<"$head_json")"
            tree_json="$(curl --fail --silent --show-error --location --max-time 20 \
              "https://api.github.com/repos/$repository/git/trees/$repository_sha?recursive=1")"
            [[ "$(jq -r '.truncated' <<<"$tree_json")" == "false" ]] || {
              echo "::error::$repository tree truncado o ilegible"
              exit 1
            }

            consumer_json="$(mktemp)"
            jq -n --arg repository "$repository" --arg sha "$repository_sha" \
              '{repository:$repository,repository_sha:$sha,workflows:[]}' \
              > "$consumer_json"

            while IFS=
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.validate.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: validate
        name: Verificar SHA, Issues, puerta y v1
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GATE_ISSUE: ${{ inputs.gate_issue }}
        run: |
          set -euo pipefail
          [[ "$GATE_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::gate_issue inválido"; exit 1; }

          default_sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
          printf '{}\n' > /tmp/issues.json
          for number in {1..14} 54 83; do
            state="$(gh api "repos/$REPOSITORY/issues/$number" --jq '.state')"
            jq --arg number "$number" --arg state "$state"               '. + {($number): {"state": $state}}' /tmp/issues.json > /tmp/issues.next
            mv /tmp/issues.next /tmp/issues.json
          done

          gh api "repos/$REPOSITORY/issues/$GATE_ISSUE" > /tmp/gate.json
          gh api --paginate "repos/$REPOSITORY/issues/$GATE_ISSUE/comments?per_page=100"             --slurp | jq 'add // []' > /tmp/comments.json

          gh api --paginate "repos/$REPOSITORY/rulesets?includes_parents=true&per_page=100"             --slurp | jq 'add // []' > /tmp/ruleset-index.json
          printf '[]\n' > /tmp/rulesets.json
          jq -r '.[].id' /tmp/ruleset-index.json | while IFS= read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::ruleset id inválido"
              exit 1
            }
            gh api "repos/$REPOSITORY/rulesets/$ruleset_id?includes_parents=true" > /tmp/ruleset.json
            jq --slurpfile item /tmp/ruleset.json '. + $item'               /tmp/rulesets.json > /tmp/rulesets.next
            mv /tmp/rulesets.next /tmp/rulesets.json
          done
          python3 scripts/verificar_ruleset_v1.py < /tmp/rulesets.json

          v1_sha=""
          ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/v1" 2>/dev/null || true)"
          if [[ -n "$ref_json" ]]; then
            ref_type="$(jq -r '.object.type' <<<"$ref_json")"
            ref_object="$(jq -r '.object.sha' <<<"$ref_json")"
            case "$ref_type" in
              commit) v1_sha="$ref_object" ;;
              tag) v1_sha="$(gh api "repos/$REPOSITORY/git/tags/$ref_object" --jq '.object.sha')" ;;
            esac
          fi

          v1_0_0_exists=false
          if response="$(gh api --include --silent "repos/$REPOSITORY/git/ref/tags/v1.0.0" 2>&1)"; then
            v1_0_0_exists=true
          elif grep -Eq '^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$)' <<<"$response"; then
            v1_0_0_exists=false
          else
            printf '%s\n' "$response" >&2
            echo "::error::No se pudo determinar si existe v1.0.0" >&2
            exit 1
          fi

          jq -n             --arg repository "$REPOSITORY"             --arg repository_owner "$REPOSITORY_OWNER"             --arg actor "$ACTOR"             --arg event_name "$EVENT_NAME"             --arg ref "$REF_NAME"             --arg default_branch "$DEFAULT_BRANCH"             --arg expected_sha "$EXPECTED_SHA"             --arg current_sha "$CURRENT_SHA"             --arg default_branch_sha "$default_sha"             --arg v1_sha "$v1_sha"             --argjson v1_0_0_exists "$v1_0_0_exists"             --slurpfile issues /tmp/issues.json             --slurpfile gate /tmp/gate.json             --slurpfile comments /tmp/comments.json             '{
              repository:$repository, repository_owner:$repository_owner,
              actor:$actor, event_name:$event_name, ref:$ref,
              default_branch:$default_branch, expected_sha:$expected_sha,
              current_sha:$current_sha, default_branch_sha:$default_branch_sha,
              v1_sha:$v1_sha, v1_0_0_exists:$v1_0_0_exists, issues:$issues[0],
              gate:{
                state:$gate[0].state,
                author_association:$gate[0].author_association,
                closed_by:($gate[0].closed_by.login // ""),
                body:($gate[0].body // ""),
                comments:($comments[0] | map({
                  author_association,
                  user:{login:(.user.login // "")},
                  body:(.body // "")
                }))
              }
            }' > /tmp/release-bootstrap.json

          python3 -m scripts.release_bootstrap < /tmp/release-bootstrap.json             | tee /tmp/release-bootstrap-result.json
          approved_sha="$(jq -r '.sha' /tmp/release-bootstrap-result.json)"
          echo "approved_sha=$approved_sha" >> "$GITHUB_OUTPUT"

  release:
    name: Publicar release semántico desde v1
    needs: preflight
    permissions:
      contents: write
    uses: pl0n3r/factory/.github/workflows/release.yml@v1
    with:
      version_source: config/version.json
      version_format: json
      factory_bootstrap: true
      expected_sha: ${{ needs.preflight.outputs.approved_sha }}

  selftest-published:
    name: Self-test del canal v1 publicado
    needs: release
    permissions:
      contents: read
    uses: pl0n3r/factory/.github/workflows/ci.yml@v1
    with:
      stack: php
      working_directory: template
      version_source: config/version.json
      label_language: es
      phase: construccion
      kit_ref: v1
      factory_release_bootstrap: true
\t' read -r path blob_sha; do
              [[ -n "$path" ]] || continue
              workflow_file="$(mktemp)"
              curl --fail --silent --show-error --location --max-time 20 \
                --output "$workflow_file" \
                "https://raw.githubusercontent.com/$repository/$repository_sha/$path"
              content_b64="$(base64 -w 0 "$workflow_file")"
              jq --arg path "$path" \
                --arg blob_sha "$blob_sha" \
                --arg repository_sha "$repository_sha" \
                --arg content_b64 "$content_b64" \
                '.workflows += [{
                  path:$path,
                  blob_sha:$blob_sha,
                  repository_sha:$repository_sha,
                  content_b64:$content_b64
                }]' "$consumer_json" > "$consumer_json.next"
              mv "$consumer_json.next" "$consumer_json"
              rm -f "$workflow_file"
            done < <(
              jq -r '.tree[]
                | select(.type == "blob")
                | select(.path | test("^\\.github/workflows/[A-Za-z0-9._-]+\\.ya?ml$"))
                | [.path, .sha]
                | @tsv' <<<"$tree_json"
            )

            jq --slurpfile consumer "$consumer_json" \
              '.consumers += $consumer' /tmp/reusable-consumers.json \
              > /tmp/reusable-consumers.next.json
            mv /tmp/reusable-consumers.next.json /tmp/reusable-consumers.json
            rm -f "$consumer_json"
          done

          python3 -m scripts.reusable_release_preflight \
            < /tmp/reusable-consumers.json \
            | tee /tmp/reusable-release-preflight.json
          [[ "$(jq -r '.status' /tmp/reusable-release-preflight.json)" == "COMPATIBLE" ]]

  preflight:
    name: Validar gates de release v1.x
    needs: [candidate-template, consumer-compat]
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.validate.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: validate
        name: Verificar SHA, Issues, puerta y v1
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GATE_ISSUE: ${{ inputs.gate_issue }}
        run: |
          set -euo pipefail
          [[ "$GATE_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::gate_issue inválido"; exit 1; }

          default_sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
          printf '{}\n' > /tmp/issues.json
          for number in {1..14} 54 83; do
            state="$(gh api "repos/$REPOSITORY/issues/$number" --jq '.state')"
            jq --arg number "$number" --arg state "$state"               '. + {($number): {"state": $state}}' /tmp/issues.json > /tmp/issues.next
            mv /tmp/issues.next /tmp/issues.json
          done

          gh api "repos/$REPOSITORY/issues/$GATE_ISSUE" > /tmp/gate.json
          gh api --paginate "repos/$REPOSITORY/issues/$GATE_ISSUE/comments?per_page=100"             --slurp | jq 'add // []' > /tmp/comments.json

          gh api --paginate "repos/$REPOSITORY/rulesets?includes_parents=true&per_page=100"             --slurp | jq 'add // []' > /tmp/ruleset-index.json
          printf '[]\n' > /tmp/rulesets.json
          jq -r '.[].id' /tmp/ruleset-index.json | while IFS= read -r ruleset_id; do
            [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::ruleset id inválido"
              exit 1
            }
            gh api "repos/$REPOSITORY/rulesets/$ruleset_id?includes_parents=true" > /tmp/ruleset.json
            jq --slurpfile item /tmp/ruleset.json '. + $item'               /tmp/rulesets.json > /tmp/rulesets.next
            mv /tmp/rulesets.next /tmp/rulesets.json
          done
          python3 scripts/verificar_ruleset_v1.py < /tmp/rulesets.json

          v1_sha=""
          ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/v1" 2>/dev/null || true)"
          if [[ -n "$ref_json" ]]; then
            ref_type="$(jq -r '.object.type' <<<"$ref_json")"
            ref_object="$(jq -r '.object.sha' <<<"$ref_json")"
            case "$ref_type" in
              commit) v1_sha="$ref_object" ;;
              tag) v1_sha="$(gh api "repos/$REPOSITORY/git/tags/$ref_object" --jq '.object.sha')" ;;
            esac
          fi

          v1_0_0_exists=false
          if response="$(gh api --include --silent "repos/$REPOSITORY/git/ref/tags/v1.0.0" 2>&1)"; then
            v1_0_0_exists=true
          elif grep -Eq '^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$)' <<<"$response"; then
            v1_0_0_exists=false
          else
            printf '%s\n' "$response" >&2
            echo "::error::No se pudo determinar si existe v1.0.0" >&2
            exit 1
          fi

          jq -n             --arg repository "$REPOSITORY"             --arg repository_owner "$REPOSITORY_OWNER"             --arg actor "$ACTOR"             --arg event_name "$EVENT_NAME"             --arg ref "$REF_NAME"             --arg default_branch "$DEFAULT_BRANCH"             --arg expected_sha "$EXPECTED_SHA"             --arg current_sha "$CURRENT_SHA"             --arg default_branch_sha "$default_sha"             --arg v1_sha "$v1_sha"             --argjson v1_0_0_exists "$v1_0_0_exists"             --slurpfile issues /tmp/issues.json             --slurpfile gate /tmp/gate.json             --slurpfile comments /tmp/comments.json             '{
              repository:$repository, repository_owner:$repository_owner,
              actor:$actor, event_name:$event_name, ref:$ref,
              default_branch:$default_branch, expected_sha:$expected_sha,
              current_sha:$current_sha, default_branch_sha:$default_branch_sha,
              v1_sha:$v1_sha, v1_0_0_exists:$v1_0_0_exists, issues:$issues[0],
              gate:{
                state:$gate[0].state,
                author_association:$gate[0].author_association,
                closed_by:($gate[0].closed_by.login // ""),
                body:($gate[0].body // ""),
                comments:($comments[0] | map({
                  author_association,
                  user:{login:(.user.login // "")},
                  body:(.body // "")
                }))
              }
            }' > /tmp/release-bootstrap.json

          python3 -m scripts.release_bootstrap < /tmp/release-bootstrap.json             | tee /tmp/release-bootstrap-result.json
          approved_sha="$(jq -r '.sha' /tmp/release-bootstrap-result.json)"
          echo "approved_sha=$approved_sha" >> "$GITHUB_OUTPUT"

  release:
    name: Publicar release semántico desde v1
    needs: preflight
    permissions:
      contents: write
    uses: pl0n3r/factory/.github/workflows/release.yml@v1
    with:
      version_source: config/version.json
      version_format: json
      factory_bootstrap: true
      expected_sha: ${{ needs.preflight.outputs.approved_sha }}

  selftest-published:
    name: Self-test del canal v1 publicado
    needs: release
    permissions:
      contents: read
    uses: pl0n3r/factory/.github/workflows/ci.yml@v1
    with:
      stack: php
      working_directory: template
      version_source: config/version.json
      label_language: es
      phase: construccion
      kit_ref: v1
      factory_release_bootstrap: true
