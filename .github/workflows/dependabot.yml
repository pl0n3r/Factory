name: Dependabot reusable

# Factory #2222: los dos jobs que necesitan `actions: write` (dispatch de CI
# exact-main tras el squash de Dependabot, #2212) viven en su propio reusable.
# GitHub valida los permisos de TODOS los jobs de un reusable al cargarlo, así
# que tenerlos en coordinacion.yml obligaba a los 35 callers de coordinación a
# conceder `actions: write`. Solo un caller Dependabot dedicado llama a este.
on:
  workflow_call:
    inputs:
      operation:
        description: 'dependabot o dependabot-sweep'
        required: true
        type: string
      pr_number:
        required: false
        default: 0
        type: number
      head_sha:
        description: HEAD exacto del PR Dependabot para reconciliación desde workflow_run
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: factory-dependabot-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  validar-input:
    name: Validar operación Dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in dependabot|dependabot-sweep) ;; *) echo "::error::operation inválida"; exit 1 ;; esac

  dependabot:
    name: Reconciliar Dependabot
    if: >-
      inputs.operation == 'dependabot' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      checks: read
      issues: write
      pull-requests: write
    steps:
      # Solo kit desde el workflow protegido, nunca checkout del HEAD de Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Reconciliar PR y habilitar squash protegido o crear seguimiento
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Número de PR no válido"; exit 1; }
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HEAD no válido"; exit 1; }
          python3 .factory/scripts/dependabot_lane.py reconcile --repo "$REPOSITORIO" --pr "$PR" --head "$HEAD"

  dependabot-sweep:
    name: Barrer Dependabot consumidor
    if: inputs.operation == 'dependabot-sweep' && github.event_name == 'schedule'
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Barrer consumidor sin checkout de PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/dependabot_lane.py sweep --repo "$REPOSITORIO"
