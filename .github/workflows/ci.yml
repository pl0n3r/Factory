name: CI reusable
on:
  workflow_call:
    inputs:
      stack: {required: true, type: string}
      domain: {required: false, default: '', type: string}
      version_source: {required: false, default: '', type: string}
      label_language: {required: false, default: 'es', type: string}
      phase: {required: false, default: 'construccion', type: string}
      php_version: {required: false, default: '8.3', type: string}
      node_enabled: {required: false, default: false, type: boolean}
      node_version: {required: false, default: '24', type: string}
      working_directory: {required: false, default: '.', type: string}
      kit_ref: {required: false, default: 'v1', type: string}
permissions:
  contents: read
cache-mode: read
jobs:
  event_guard:
    name: Guardar contexto del caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Rechazar eventos privilegiados
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|push|merge_group) ;;
            *) echo "::error::CI reusable no acepta evento privilegiado/no permitido: $EVENT_NAME"; exit 1 ;;
          esac

  preflight:
    name: Preflight reusable
    needs: event_guard
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validar contrato
        env:
          STACK: ${{ inputs.stack }}
          DOMAIN: ${{ inputs.domain }}
          VERSION_SOURCE: ${{ inputs.version_source }}
          LABEL_LANGUAGE: ${{ inputs.label_language }}
          PHASE: ${{ inputs.phase }}
          NODE_ENABLED: ${{ inputs.node_enabled }}
          WORKDIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          case "$STACK" in symfony|laravel|php) ;; *) echo "::error::stack inválido"; exit 1 ;; esac
          case "$LABEL_LANGUAGE" in es|en) ;; *) echo "::error::label_language inválido"; exit 1 ;; esac
          case "$PHASE" in construccion|live) ;; *) echo "::error::phase inválida"; exit 1 ;; esac
          [[ "$WORKDIR" != /* && "$WORKDIR" != *".."* && "$WORKDIR" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::working_directory inválido"; exit 1; }
          test -d "$WORKDIR" || { echo "::error::working_directory no existe"; exit 1; }
          cd "$WORKDIR"
          if [[ -n "$DOMAIN" && ! "$DOMAIN" =~ ^https://[^[:space:]]+$ ]]; then echo "::error::domain debe ser HTTPS o vacío"; exit 1; fi
          if [[ -n "$VERSION_SOURCE" ]]; then
            case "$VERSION_SOURCE" in config/version.php|config/version.json) ;; *) echo "::error::version_source no permitido"; exit 1 ;; esac
            [[ -f "$VERSION_SOURCE" && ! -L "$VERSION_SOURCE" ]] || { echo "::error::version_source debe ser archivo regular"; exit 1; }
          fi
          if [[ "$STACK" =~ ^(symfony|laravel)$ && ! -f composer.lock ]]; then echo "::error::$STACK requiere composer.lock"; exit 1; fi
          if [[ "$NODE_ENABLED" == "true" && ! -f package-lock.json ]]; then echo "::error::node_enabled requiere package-lock.json"; exit 1; fi
  php:
    name: PHP base
    needs: preflight
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: ${{ inputs.kit_ref }}
          path: .factory
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php_version }}
          coverage: none
      - name: Validar Composer
        env:
          WORKDIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          if [[ -f composer.json ]]; then
            env \
              -u ACTIONS_CACHE_URL \
              -u ACTIONS_RUNTIME_TOKEN \
              -u ACTIONS_RESULTS_URL \
              -u ACTIONS_CACHE_SERVICE_V2 \
              composer validate --strict
          fi
      - name: Instalar Composer bloqueado
        if: hashFiles(format('{0}/composer.lock', inputs.working_directory)) != ''
        uses: ./.factory/actions/retry
        with:
          working-directory: ${{ inputs.working_directory }}
          operation: composer-install
      - name: Sintaxis y pruebas PHP
        env:
          WORKDIR: ${{ inputs.working_directory }}
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          safe_env=(
            env
            -u ACTIONS_CACHE_URL
            -u ACTIONS_RUNTIME_TOKEN
            -u ACTIONS_RESULTS_URL
            -u ACTIONS_CACHE_SERVICE_V2
          )

          while IFS= read -r -d '' file; do
            "${safe_env[@]}" php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

          if [[ -f composer.json ]]; then
            has_test="$(python3 -c 'import json; payload=json.load(open("composer.json", encoding="utf-8")); scripts=payload.get("scripts"); print("true" if isinstance(scripts, dict) and "test" in scripts else "false")')"
            if [[ "$has_test" == "true" ]]; then
              "${safe_env[@]}" composer test --no-interaction
              exit 0
            fi
          fi

          if [[ "$STACK" == "symfony" && -f vendor/bin/simple-phpunit ]]; then
            "${safe_env[@]}" vendor/bin/simple-phpunit
          elif [[ "$STACK" == "laravel" && -f artisan ]]; then
            "${safe_env[@]}" php artisan test
          fi
  node:
    name: Node opcional
    if: inputs.node_enabled && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: ${{ inputs.kit_ref }}
          path: .factory
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node_version }}
      - name: Instalar npm bloqueado
        uses: ./.factory/actions/retry
        with:
          working-directory: ${{ inputs.working_directory }}
          operation: npm-ci
      - name: Pruebas y build Node
        env:
          WORKDIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          safe_env=(
            env
            -u ACTIONS_CACHE_URL
            -u ACTIONS_RUNTIME_TOKEN
            -u ACTIONS_RESULTS_URL
            -u ACTIONS_CACHE_SERVICE_V2
          )
          "${safe_env[@]}" npm test --if-present
          "${safe_env[@]}" npm run build --if-present
  validar:
    name: Validar
    needs: [event_guard, preflight, php, node]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for r in $RESULTADOS; do case "$r" in success|skipped) ;; *) echo "::error::Gate reusable con resultado $r"; exit 1 ;; esac; done
