name: Coordinación reusable

on:
  workflow_call:
    inputs:
      operation:
        description: 'comment, label, pr, issue, validate, dependabot, dependabot-sweep o sweep'
        required: true
        type: string
      issue_number:
        required: false
        default: 0
        type: number
      pr_number:
        required: false
        default: 0
        type: number
      head_sha:
        description: HEAD exacto del PR Dependabot para reconciliación desde workflow_run
        required: false
        default: ''
        type: string
      actor:
        required: false
        default: ''
        type: string
      association:
        required: false
        default: ''
        type: string
      body:
        required: false
        default: ''
        type: string
      label:
        required: false
        default: ''
        type: string
      action:
        required: false
        default: ''
        type: string
      require_reservation:
        required: false
        default: true
        type: boolean
      profile:
        description: 'Perfil de coordinación: es o en'
        required: false
        default: 'es'
        type: string
      kit_ref:
        required: false
        default: 'v1'
        type: string
      shared_version_paths:
        description: 'Lista JSON de hasta 4 archivos de versión compartidos (#2163); vacío conserva la regla exclusiva'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'validate' && format('factory-coordination-{0}-validate-{1}', github.repository_id, inputs.pr_number) || format('factory-coordination-{0}', github.repository_id) }}
  cancel-in-progress: false

jobs:
  validar-input:
    name: Validar operación
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          OPERATION: ${{ inputs.operation }}
          PROFILE: ${{ inputs.profile }}
          SHARED_VERSION_PATHS: ${{ inputs.shared_version_paths }}
        run: |
          set -euo pipefail
          case "$OPERATION" in comment|label|pr|issue|validate|dependabot|dependabot-sweep|sweep) ;; *) echo "::error::operation inválida"; exit 1 ;; esac
          case "$PROFILE" in es|en) ;; *) echo "::error::profile inválido"; exit 1 ;; esac
          if [[ -n "$SHARED_VERSION_PATHS" ]]; then
            jq -e 'type == "array" and length <= 4 and all(.[]; type == "string")' <<<"$SHARED_VERSION_PATHS" >/dev/null \
              || { echo "::error::shared_version_paths inválido"; exit 1; }
          fi

  comentario:
    name: Procesar comando
    if: inputs.operation == 'comment'
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          FACTORY_COORDINATION_PROFILE: ${{ inputs.profile }}
          ISSUE: ${{ inputs.issue_number }}
          ACTOR: ${{ inputs.actor }}
          ASSOCIATION: ${{ inputs.association }}
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/coordinar_trabajo.py comentario --repo "$REPOSITORIO" --issue "$ISSUE" --actor "$ACTOR" --association "$ASSOCIATION" --body "$BODY"

  etiqueta:
    name: Sincronizar reserva
    if: inputs.operation == 'label'
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          FACTORY_COORDINATION_PROFILE: ${{ inputs.profile }}
          ISSUE: ${{ inputs.issue_number }}
          ACTOR: ${{ inputs.actor }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/coordinar_trabajo.py label-event --repo "$REPOSITORIO" --issue "$ISSUE" --actor "$ACTOR" --label "$LABEL"

  pr:
    name: Sincronizar PR
    if: inputs.operation == 'pr'
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory
          persist-credentials: false
      # Clasificar solo PR abierto; la API autenticada verifica bot/app, firma,
      # diff permitido, semver y HEAD/BASE. Error => job fallido sin mutaciones V3.
      - name: Clasificar Dependabot oficial antes de sincronizar
        id: dependabot-lane
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/dependabot_lane.py classify --repo "$REPOSITORIO" --pr "$PR" --head "$HEAD"
          echo 'approved=true' >> "$GITHUB_OUTPUT"

      # El clasificador exige state=open: nunca usarlo para cierres del bot.
      # El cierre humano conserva pr-event; el del bot no toca leases ajenas.
      - name: Sincronizar PR V3
        if: >-
          steps.dependabot-lane.outputs.approved != 'true' &&
          !(
            github.event_name == 'pull_request' &&
            github.event.action == 'closed' &&
            github.event.pull_request.user.login == 'dependabot[bot]'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          FACTORY_COORDINATION_PROFILE: ${{ inputs.profile }}
          PR: ${{ inputs.pr_number }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/coordinar_trabajo.py pr-event --repo "$REPOSITORIO" --pr "$PR" --action "$ACTION"

  issue:
    name: Sincronizar Issue
    if: inputs.operation == 'issue'
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          FACTORY_COORDINATION_PROFILE: ${{ inputs.profile }}
          ISSUE: ${{ inputs.issue_number }}
          ACTION: ${{ inputs.action }}
        run: python3 .factory/scripts/coordinar_trabajo.py issue-event --repo "$REPOSITORIO" --issue "$ISSUE" --action "$ACTION"

  validar-pr:
    name: Validar coordinación
    if: >-
      inputs.operation == 'validate' &&
      !(
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true
      )
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory
          persist-credentials: false
      - name: Verificar carril oficial Dependabot
        id: dependabot-lane
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/dependabot_lane.py classify --repo "$REPOSITORIO" --pr "$PR" --head "$HEAD"
          echo 'approved=true' >> "$GITHUB_OUTPUT"

      - if: steps.dependabot-lane.outputs.approved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          FACTORY_COORDINATION_PROFILE: ${{ inputs.profile }}
          FACTORY_SHARED_VERSION_PATHS: ${{ inputs.shared_version_paths }}
          PR: ${{ inputs.pr_number }}
          REQUIRE_RESERVATION: ${{ inputs.require_reservation }}
        run: |
          set -euo pipefail
          args=()
          [[ "$REQUIRE_RESERVATION" == "true" ]] && args+=(--require-reservation)
          python3 .factory/scripts/coordinar_trabajo.py validar-pr --repo "$REPOSITORIO" --pr "$PR" "${args[@]}"

  dependabot:
    name: Reconciliar Dependabot
    if: >-
      inputs.operation == 'dependabot' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
      issues: write
      pull-requests: write
    steps:
      # Solo kit desde el workflow protegido, nunca checkout del HEAD de Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Reconciliar PR y habilitar squash protegido o crear seguimiento
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Número de PR no válido"; exit 1; }
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HEAD no válido"; exit 1; }
          python3 .factory/scripts/dependabot_lane.py reconcile --repo "$REPOSITORIO" --pr "$PR" --head "$HEAD"

  dependabot-sweep:
    name: Barrer Dependabot consumidor
    if: inputs.operation == 'dependabot-sweep' && github.event_name == 'schedule'
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Barrer consumidor sin checkout de PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/dependabot_lane.py sweep --repo "$REPOSITORIO"

  sweep:
    name: Barrer coordinación y bloqueos
    if: inputs.operation == 'sweep'
    needs: validar-input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          FACTORY_COORDINATION_PROFILE: ${{ inputs.profile }}
        run: python3 .factory/scripts/coordinar_trabajo.py marcar-inactivas --repo "$REPOSITORIO"
