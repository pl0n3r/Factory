name: Política reusable
on:
  workflow_call:
    inputs:
      pr_number: {required: true, type: number}
      required_review_bot: {required: false, type: string, default: ""}
      factory_ref: {required: false, type: string, default: "v1"}
permissions:
  contents: read
  pull-requests: read
jobs:
  politica:
    name: Validar decisiones y límite de revisión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar evento, PR, HEAD y policy base antes de checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          FACTORY_REF: ${{ inputs.factory_ref }}
        run: |
          set -euo pipefail
          case "$FACTORY_REF" in
            v1) ;;
            *)
              [[ "$FACTORY_REF" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::factory_ref debe ser v1 o un SHA lowercase exacto de 40 hex"
                exit 1
              }
              ;;
          esac

          case "$EVENT_NAME" in
            pull_request|pull_request_review) ;;
            *) echo "::error::Evento no permitido"; exit 1 ;;
          esac
          [[ "$EVENT_PR" == "$INPUT_PR" ]] || { echo "::error::Contexto PR inválido"; exit 1; }
          [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HEAD de evento inválido"; exit 1; }
          [[ "$EVENT_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::BASE de evento inválida"; exit 1; }

          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$INPUT_PR")"
          CURRENT_HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
          CURRENT_BASE="$(jq -r '.base.sha' <<<"$PR_JSON")"
          [[ "$CURRENT_HEAD" == "$EVENT_HEAD" ]] || { echo "::error::HEAD stale o PR distinto"; exit 1; }
          [[ "$CURRENT_BASE" == "$EVENT_BASE" ]] || { echo "::error::BASE stale o PR distinto"; exit 1; }
          jq -e --arg hr "$EVENT_HEAD_REF" --arg br "$EVENT_BASE_REF" \
                --arg hrepo "$EVENT_HEAD_REPO" --arg brepo "$EVENT_BASE_REPO" \
                --arg repo "$REPOSITORY" '
            .state == "open" and .head.ref == $hr and .base.ref == $br
            and .head.repo.full_name == $hrepo and .base.repo.full_name == $brepo
            and .base.repo.full_name == $repo
          ' <<<"$PR_JSON" >/dev/null || {
            echo "::error::Referencia o repositorio del PR no coincide con el evento"
            exit 1
          }

          POLICY_FILE="/tmp/factory-policy.json"
          POLICY_ERR="/tmp/factory-policy.err"
          if gh api -H "Accept: application/vnd.github.raw+json"               "repos/$REPOSITORY/contents/.github/factory-policy.json?ref=$CURRENT_BASE"               > "$POLICY_FILE" 2> "$POLICY_ERR"; then
            POLICY_BYTES="$(wc -c < "$POLICY_FILE")"
            (( POLICY_BYTES <= 4096 )) || { echo "::error::factory-policy.json excede 4096 bytes"; exit 1; }
            echo "BASE_POLICY_FILE=$POLICY_FILE" >> "$GITHUB_ENV"
          elif grep -q "HTTP 404" "$POLICY_ERR"; then
            rm -f "$POLICY_FILE"
            echo "BASE_POLICY_FILE=" >> "$GITHUB_ENV"
          else
            cat "$POLICY_ERR" >&2
            echo "::error::No se pudo leer policy desde BASE exacta"
            exit 1
          fi

          {
            echo "PR_HEAD_SHA=$CURRENT_HEAD"
            echo "PR_BASE_SHA=$CURRENT_BASE"
            echo "PR_HEAD_REF=$EVENT_HEAD_REF"
            echo "PR_BASE_REF=$EVENT_BASE_REF"
            echo "PR_HEAD_REPO=$EVENT_HEAD_REPO"
            echo "PR_BASE_REPO=$EVENT_BASE_REPO"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout Factory stable v1
        if: ${{ inputs.factory_ref == 'v1' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false

      - name: Checkout Factory exact SHA
        if: ${{ inputs.factory_ref != 'v1' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory
          persist-credentials: false

      - name: Validar política canónica con evidencia reviewer-bot observada
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          REQUIRED_REVIEW_BOT: ${{ inputs.required_review_bot }}
          MAX_EVIDENCE_BYTES: "2000000"
          MAX_PUBLIC_CHECKS: "500"
        run: |
          set -euo pipefail
          reviews_file="$(mktemp)"
          comments_file="$(mktemp)"
          checks_file="$(mktemp)"
          checks_json="$(mktemp)"
          threads_file="$(mktemp)"
          timeline_file="$(mktemp)"
          threads_json="$(mktemp)"
          phase_file="$(mktemp)"
          phase_err="$(mktemp)"
          trap 'rm -f "$reviews_file" "$comments_file" "$checks_file" "$checks_json" "$threads_file" "$threads_json" "$timeline_file" "$phase_file" "$phase_err"' EXIT

          gh api --paginate "repos/$REPOSITORY/pulls/$PR/reviews?per_page=100" \
            --jq '.[] | @json' > "$reviews_file"
          gh api --paginate "repos/$REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | @json' > "$comments_file"

          reviews_bytes="$(wc -c < "$reviews_file")"
          comments_bytes="$(wc -c < "$comments_file")"
          (( reviews_bytes <= MAX_EVIDENCE_BYTES )) || {
            echo "::error::Reviews exceden el tamaño permitido"
            exit 1
          }
          (( comments_bytes <= MAX_EVIDENCE_BYTES )) || {
            echo "::error::Comentarios exceden el tamaño permitido"
            exit 1
          }

          # POLICY_PR_RECHECK_BEGIN
          recheck_pr_identity() {
            # Lee PR nuevo incluso con primary review verde; no hereda permisos
            # de refs previas ni admite HEAD/BASE iguales desde otro origen.
            local observed="${1:-}"
            if [[ -z "$observed" ]]; then
              observed="$(gh api "repos/$REPOSITORY/pulls/$PR")" || return 1
            fi
            jq -e --arg head "$PR_HEAD_SHA" --arg base "$PR_BASE_SHA" \
                  --arg href "$PR_HEAD_REF" --arg bref "$PR_BASE_REF" \
                  --arg hrepo "$PR_HEAD_REPO" --arg brepo "$PR_BASE_REPO" \
                  --arg repo "$REPOSITORY" '
              .state == "open"
              and .head.sha == $head and .base.sha == $base
              and .head.ref == $href and .base.ref == $bref
              and .head.repo.full_name == $hrepo
              and .base.repo.full_name == $brepo
              and .base.repo.full_name == $repo
            ' <<<"$observed" >/dev/null
          }
          # POLICY_PR_RECHECK_END

          # Una revisión primaria atraviesa el mismo gate autenticado que el fallback.

          phase_args=()
          if gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$REPOSITORY/contents/datos.yml?ref=$PR_BASE_SHA" \
              > "$phase_file" 2> "$phase_err"; then
            PHASE_BYTES="$(wc -c < "$phase_file")"
            if (( PHASE_BYTES <= 524288 )) && jq -e \
              'type == "object" and (.phase == "construccion" or .phase == "live")' \
              "$phase_file" >/dev/null; then
              phase_args=(--phase-file "$phase_file")
            else
              echo "::warning::datos.yml BASE no define una fase válida; fallback reviewer deshabilitado."
            fi
          else
            echo "::warning::No se pudo leer datos.yml desde BASE exacta; fallback reviewer deshabilitado."
          fi

          HEAD_COMMIT_JSON="$(gh api "repos/$REPOSITORY/commits/$PR_HEAD_SHA")"
          HEAD_COMMITTED_AT="$(jq -r '.commit.committer.date // empty' <<<"$HEAD_COMMIT_JSON")"
          [[ "$HEAD_COMMITTED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
            echo "::error::Timestamp del HEAD exacto inválido"
            exit 1
          }

          # POLICY_CHECK_SNAPSHOT_BEGIN
          # Dos lecturas completas consecutivas e idénticas acreditan estabilidad.
          # GitHub no ofrece snapshots transaccionales de /check-runs.
          checks_url_base="repos/$REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100"
          previous_snapshot="${checks_file}.previous"
          current_snapshot="${checks_file}.canonical"
          previous_complete=false
          stable_snapshot=false
          : > "$previous_snapshot"

          for attempt in 1 2 3; do
            : > "$checks_file"
            expected_total=""
            observed_count=0
            drift=false
            for page in 1 2 3 4 5; do
              if ! gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${checks_url_base}&page=$page" > "$checks_json"; then
                echo "::error::No se pudieron leer check-runs autenticados del HEAD exacto"
                exit 1
              fi
              (( $(wc -c < "$checks_json") <= MAX_EVIDENCE_BYTES )) || {
                echo "::error::Página autenticada de check-runs excede el tamaño permitido"
                exit 1
              }
              jq -e '
                type == "object"
                and (.total_count | type == "number")
                and (.total_count >= 0)
                and (.total_count == (.total_count | floor))
                and (.check_runs | type == "array")
                and (.check_runs | length <= 100)
              ' "$checks_json" >/dev/null || {
                echo "::error::Página autenticada de check-runs inválida"
                exit 1
              }

              current_total="$(jq -r '.total_count' "$checks_json")"
              (( current_total <= MAX_PUBLIC_CHECKS )) || {
                echo "::error::Check-runs autenticados exceden el límite evaluable de $MAX_PUBLIC_CHECKS"
                exit 1
              }
              if [[ -z "$expected_total" ]]; then
                expected_total="$current_total"
              elif [[ "$current_total" != "$expected_total" ]]; then
                echo "::warning::total_count cambió entre páginas de check-runs (intento $attempt/3)"
                drift=true
                break
              fi

              jq -c '.check_runs[]' "$checks_json" >> "$checks_file"
              observed_count="$(wc -l < "$checks_file")"
              (( observed_count <= expected_total )) || {
                echo "::error::Se observaron más check-runs que total_count"
                exit 1
              }
              if (( observed_count == expected_total )); then
                break
              fi
            done
            if [[ "$drift" == true ]]; then
              previous_complete=false
              : > "$previous_snapshot"
              continue
            fi

            [[ -n "$expected_total" ]] || {
              echo "::error::No se pudo fijar total_count de check-runs"
              exit 1
            }
            (( observed_count == expected_total )) || {
              echo "::error::Evidencia incompleta de check-runs autenticados"
              exit 1
            }
            (( $(wc -c < "$checks_file") <= MAX_EVIDENCE_BYTES )) || {
              echo "::error::Checks exceden el tamaño permitido"
              exit 1
            }
            jq -s -e '
              all(.[]; ((.id | type) == "number" and .id > 0))
              and (([.[].id] | length) == ([.[].id] | unique | length))
            ' "$checks_file" >/dev/null || {
              echo "::error::IDs de check-runs autenticados inválidos o duplicados"
              exit 1
            }

            # Estabilizar también IDs, estados y metadatos, no solo total_count.
            jq -s -c 'sort_by(.id)' "$checks_file" > "$current_snapshot"
            if [[ "$previous_complete" == true ]] && \
               cmp -s "$previous_snapshot" "$current_snapshot"; then
              stable_snapshot=true
              break
            fi
            cp "$current_snapshot" "$previous_snapshot"
            previous_complete=true
          done

          [[ "$stable_snapshot" == true ]] || {
            echo "::error::Check-runs sin dos snapshots completos y estables"
            exit 1
          }
          # POLICY_CHECK_SNAPSHOT_END

          owner="${REPOSITORY%%/*}"
          repo_name="${REPOSITORY#*/}"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100){pageInfo{hasNextPage} nodes{isResolved comments(first:100){pageInfo{hasNextPage} nodes{author{login}}}}}}}}' \
            -F owner="$owner" -F repo="$repo_name" -F pr="$PR" > "$threads_json"
          jq -e '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false' "$threads_json" >/dev/null || {
            echo "::error::Review threads exceden el límite evaluable"
            exit 1
          }
          jq -e '[.data.repository.pullRequest.reviewThreads.nodes[].comments.pageInfo.hasNextPage] | all(. == false)' "$threads_json" >/dev/null || {
            echo "::error::Comentarios de review thread exceden el límite evaluable"
            exit 1
          }
          jq -c '.data.repository.pullRequest.reviewThreads.nodes[]' "$threads_json" > "$threads_file"

          (( $(wc -c < "$checks_file") <= MAX_EVIDENCE_BYTES )) || {
            echo "::error::Checks exceden el tamaño permitido"
            exit 1
          }
          (( $(wc -c < "$threads_file") <= MAX_EVIDENCE_BYTES )) || {
            echo "::error::Threads exceden el tamaño permitido"
            exit 1
          }

          # Solo reruns: anclar mensajes CodeRabbit sin SHA a la timeline REST
          # autenticada del PR. Página 6 es centinela de desbordamiento.
          timeline_args=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            : > "$timeline_file"
            timeline_complete=false
            for page in 1 2 3 4 5 6; do
              if ! gh api -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$REPOSITORY/issues/$PR/timeline?per_page=100&page=$page" \
                > "$checks_json"; then
                echo "::error::No se pudo leer timeline autenticada"
                exit 1
              fi
              (( $(wc -c < "$checks_json") <= MAX_EVIDENCE_BYTES )) || {
                echo "::error::Página de timeline excesiva"
                exit 1
              }
              jq -e 'type == "array" and length <= 100' "$checks_json" >/dev/null || {
                echo "::error::Página de timeline inválida"
                exit 1
              }
              page_count="$(jq length "$checks_json")"
              if (( page == 6 )); then
                (( page_count == 0 )) || { echo "::error::Timeline excede 500 eventos"; exit 1; }
                timeline_complete=true
                break
              fi
              jq -c '.[]' "$checks_json" >> "$timeline_file"
              (( $(wc -c < "$timeline_file") <= MAX_EVIDENCE_BYTES )) || {
                echo "::error::Timeline excede tamaño permitido"
                exit 1
              }
              if (( page_count < 100 )); then
                timeline_complete=true
                break
              fi
            done
            [[ "$timeline_complete" == true && -s "$timeline_file" ]] || {
              echo "::error::Timeline incompleta o vacía"
              exit 1
            }
            jq -s -e '
              ([.[] | select(.event == "commented") | .id] | all(. != null and type == "number"))
              and (([.[] | select(.event == "commented") | .id] | length) ==
                   ([.[] | select(.event == "commented") | .id] | unique | length))
            ' "$timeline_file" >/dev/null || {
              echo "::error::IDs de timeline incompletos o duplicados"
              exit 1
            }
            timeline_args=(--timeline-file "$timeline_file")
          fi

          args=(--required-review-bot "$REQUIRED_REVIEW_BOT" --head-sha "$PR_HEAD_SHA" --head-committed-at "$HEAD_COMMITTED_AT")
          [[ -z "${BASE_POLICY_FILE:-}" ]] || args+=(--base-policy-file "$BASE_POLICY_FILE")
          args+=("${phase_args[@]}" "${timeline_args[@]}" --comments-file "$comments_file" --checks-file "$checks_file" --threads-file "$threads_file")
          POLICY_OUTPUT="$(python3 .factory/scripts/politica_kit.py "${args[@]}" < "$reviews_file")"
          # El HEAD puede cambiar entre las lecturas de evidencia y la decisión.
          PR_JSON_FINAL="$(gh api "repos/$REPOSITORY/pulls/$PR")"
          [[ "$(jq -r '.head.sha' <<<"$PR_JSON_FINAL")" == "$PR_HEAD_SHA" ]] || {
            echo "::error::HEAD cambió durante validación de timeline"
            exit 1
          }
          [[ "$(jq -r '.base.sha' <<<"$PR_JSON_FINAL")" == "$PR_BASE_SHA" ]] || {
            echo "::error::BASE cambió durante validación de timeline"
            exit 1
          }
          recheck_pr_identity "$PR_JSON_FINAL" || {
            echo "::error::Identidad, refs o estado del PR cambiaron durante fallback"
            exit 1
          }
          printf '%s\n' "$POLICY_OUTPUT"

          if [[ "$(jq -r '.review_fallback // false' <<<"$POLICY_OUTPUT")" == "true" ]]; then
            retry_id="$(jq -r '.rate_limit_comment_id' <<<"$POLICY_OUTPUT")"
            retry_at="$(jq -r '.rate_limit_created_at' <<<"$POLICY_OUTPUT")"
            [[ "$retry_id" =~ ^[0-9]+$ ]] || { echo "::error::Evidence comment id inválido"; exit 1; }
            [[ "$retry_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || { echo "::error::Evidence timestamp inválido"; exit 1; }

            evidence_url="https://github.com/$REPOSITORY/pull/$PR#issuecomment-$retry_id"
            {
              echo "### Reviewer rate-limit fallback"
              echo
              printf -- '- HEAD exacto: %s\n' "$PR_HEAD_SHA"
              printf -- '- Reintento rate-limited: %s\n' "$retry_at"
              printf -- '- Evidencia: %s\n' "$evidence_url"
              printf '%s\n' '- Alcance: solo fase construccion; revisión externa obligatoria antes de live.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Reviewer rate-limit fallback::HEAD $PR_HEAD_SHA · evidencia $evidence_url"
          fi
