name: Política reusable
on:
  workflow_call:
    inputs:
      pr_number: {required: true, type: number}
      required_review_bot: {required: false, type: string, default: ""}
permissions:
  contents: read
  pull-requests: read
jobs:
  politica:
    name: Validar decisiones y límite de revisión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar evento, PR y HEAD antes de checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_review) ;;
            *) echo "::error::Evento no permitido"; exit 1 ;;
          esac
          [[ "$EVENT_PR" == "$INPUT_PR" ]] || { echo "::error::Contexto PR inválido"; exit 1; }
          [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HEAD de evento inválido"; exit 1; }
          CURRENT_HEAD="$(gh api "repos/$REPOSITORY/pulls/$INPUT_PR" --jq '.head.sha')"
          [[ "$CURRENT_HEAD" == "$EVENT_HEAD" ]] || { echo "::error::HEAD stale o PR distinto"; exit 1; }
          echo "PR_HEAD_SHA=$CURRENT_HEAD" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false

      - name: Validar política canónica con reviews observadas
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          REQUIRED_REVIEW_BOT: ${{ inputs.required_review_bot }}
          REPOSITORY_REQUIRED_REVIEW_BOT: ${{ vars.FACTORY_REQUIRED_REVIEW_BOT }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/pulls/$PR/reviews?per_page=100" --jq '.[] | @json' \
            | python3 .factory/scripts/politica_kit.py \
                --required-review-bot "$REQUIRED_REVIEW_BOT" \
                --repository-required-review-bot "$REPOSITORY_REQUIRED_REVIEW_BOT" \
                --head-sha "$PR_HEAD_SHA"
