name: Etiquetas reutilizables

on:
  workflow_call:
    inputs:
      mode:
        description: 'sync, validate o sweep'
        required: true
        type: string
      language:
        description: 'es o en'
        required: false
        default: 'es'
        type: string
      issue_number:
        description: 'Issue o PR a validar cuando mode=validate'
        required: false
        default: 0
        type: number

permissions:
  contents: read

concurrency:
  group: labels-${{ github.repository }}-${{ inputs.mode }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  etiquetas:
    name: Labels
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Validar inputs
        env:
          MODE: ${{ inputs.mode }}
          LANGUAGE: ${{ inputs.language }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          case "$MODE" in sync|validate|sweep) ;; *) echo "::error::mode debe ser sync, validate o sweep"; exit 1 ;; esac
          case "$LANGUAGE" in es|en) ;; *) echo "::error::language debe ser es o en"; exit 1 ;; esac
          if [[ "$MODE" == "validate" && "$ISSUE_NUMBER" == "0" ]]; then
            echo "::error::issue_number es obligatorio cuando mode=validate"
            exit 1
          fi

      - name: Descargar kit Factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false

      - name: Validar catálogo
        env:
          LANGUAGE: ${{ inputs.language }}
        run: python3 .factory/scripts/labels_kit.py validate-catalog --language "$LANGUAGE"

      - name: Sincronizar catálogo
        if: inputs.mode == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORIO/labels?per_page=100" --slurp \
            | jq 'add // []' > /tmp/existing.json
          python3 .factory/scripts/labels_kit.py upsert-plan --language "$LANGUAGE" < /tmp/existing.json > /tmp/plan.json
          jq -c '.[]' /tmp/plan.json | while IFS= read -r item; do
            action="$(jq -r '.action' <<<"$item")"
            name="$(jq -r '.name' <<<"$item")"
            color="$(jq -r '.color' <<<"$item")"
            description="$(jq -r '.description' <<<"$item")"
            case "$action" in
              create)
                gh api --method POST "repos/$REPOSITORIO/labels" -f name="$name" -f color="$color" -f description="$description" >/dev/null
                ;;
              update)
                encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$name")"
                gh api --method PATCH "repos/$REPOSITORIO/labels/$encoded" -f new_name="$name" -f color="$color" -f description="$description" >/dev/null
                ;;
              rename)
                old_name="$(jq -r '.old_name' <<<"$item")"
                encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$old_name")"
                gh api --method PATCH "repos/$REPOSITORIO/labels/$encoded" -f new_name="$name" -f color="$color" -f description="$description" >/dev/null
                ;;
              *)
                echo "::error::acción de sync desconocida: $action"
                exit 1
                ;;
            esac
          done

      - name: Validar Issue o PR
        if: inputs.mode == 'validate'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORIO/issues/$ISSUE_NUMBER" > /tmp/item.json
          body="$(jq -r '.body // ""' /tmp/item.json)"
          closing_json="$(printf '%s' "$body" | python3 .factory/scripts/labels_kit.py closing-reference --language "$LANGUAGE")"
          closing="$(jq -r '.number // empty' <<<"$closing_json")"
          printf 'null\n' > /tmp/linked.json
          if [[ -n "$closing" ]]; then
            gh api "repos/$REPOSITORIO/issues/$closing" > /tmp/linked.json
          fi
          jq -n --slurpfile item /tmp/item.json --slurpfile linked /tmp/linked.json \
            '{labels:$item[0].labels,is_pull_request:($item[0].pull_request != null),body:($item[0].body // ""),linked_issue:$linked[0]}' \
            | python3 .factory/scripts/labels_kit.py plan-validation --language "$LANGUAGE" > /tmp/plan.json

          jq -r '.add[]' /tmp/plan.json > /tmp/add-labels.txt
          if [[ -s /tmp/add-labels.txt ]]; then
            jq -Rn '[inputs] | {labels:.}' < /tmp/add-labels.txt > /tmp/add-labels.json
            gh api --method POST "repos/$REPOSITORIO/issues/$ISSUE_NUMBER/labels" --input /tmp/add-labels.json >/dev/null
          fi

          marker='<!-- factory-label-validation -->'
          comment_id="$(gh api --paginate "repos/$REPOSITORIO/issues/$ISSUE_NUMBER/comments?per_page=100" --slurp \
            | jq -r --arg marker "$marker" 'add // [] | map(select((.user.login // "") == "github-actions[bot]" and ((.body // "") | startswith($marker)))) | first | .id // empty')"
          jq -r '.warning.body' /tmp/plan.json > /tmp/warning.md
          jq -n --rawfile body /tmp/warning.md '{body:$body}' > /tmp/comment.json
          warning_action="$(jq -r '.warning.action' /tmp/plan.json)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORIO/issues/comments/$comment_id" --input /tmp/comment.json >/dev/null
          elif [[ "$warning_action" == "warn" ]]; then
            gh api --method POST "repos/$REPOSITORIO/issues/$ISSUE_NUMBER/comments" --input /tmp/comment.json >/dev/null
          fi

          jq -e '.valid == true' /tmp/plan.json >/dev/null || {
            echo "::error::Labels incompletas o duplicadas después de las reparaciones seguras"
            exit 1
          }
      - name: Barrer trabajo abierto
        if: inputs.mode == 'sweep'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          marker='<!-- factory-auto-unlabeled -->'
          gh api --paginate "repos/$REPOSITORIO/issues?state=all&per_page=100" --jq '.[] | @json' > /tmp/all.ndjson
          auto_issue="$(jq -sr --arg marker "$marker" 'map(select((.user.login // "") == "github-actions[bot]" and ((.body // "") | startswith($marker)))) | sort_by(.number) | first | .number // empty' /tmp/all.ndjson)"

          gh api --paginate "repos/$REPOSITORIO/issues?state=open&per_page=100" --jq '.[] | @json' > /tmp/open.ndjson
          if [[ -n "$auto_issue" ]]; then
            jq -c --argjson auto "$auto_issue" 'select(.number != $auto)' /tmp/open.ndjson > /tmp/sweep.ndjson
          else
            cp /tmp/open.ndjson /tmp/sweep.ndjson
          fi
          python3 .factory/scripts/labels_kit.py sweep-plan --language "$LANGUAGE" < /tmp/sweep.ndjson > /tmp/sweep-plan.json
          action="$(jq -r '.action' /tmp/sweep-plan.json)"

          if [[ "$action" == "upsert" ]]; then
            jq '{title:.title,body:.body,labels:.labels}' /tmp/sweep-plan.json > /tmp/auto-create.json
            if [[ -n "$auto_issue" ]]; then
              jq '. + {state:"open"}' /tmp/auto-create.json > /tmp/auto-update.json
              gh api --method PATCH "repos/$REPOSITORIO/issues/$auto_issue" --input /tmp/auto-update.json >/dev/null
            else
              auto_issue="$(gh api --method POST "repos/$REPOSITORIO/issues" --input /tmp/auto-create.json --jq '.number')"
            fi
          elif [[ "$action" == "close" && -n "$auto_issue" ]]; then
            jq '{body:.body,labels:.labels} + {state:"closed",state_reason:"completed"}' /tmp/sweep-plan.json > /tmp/auto-close.json
            gh api --method PATCH "repos/$REPOSITORIO/issues/$auto_issue" --input /tmp/auto-close.json >/dev/null
          fi
