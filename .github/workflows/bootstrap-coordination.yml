name: Bootstrap coordinación en consumidor

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target_repository: {description: Repositorio existente pl0n3r/*, required: true, type: string}
      target_issue: {description: Issue abierto que necesita coordinación, required: true, type: number}
      expected_main_sha: {description: SHA exacto de main del consumidor, required: true, type: string}
      governance_ref: {description: Gobernanza publicada, required: true, default: 'pl0n3r/factory@v1', type: string}
      idempotency_key: {description: SHA-256 de la intención, required: true, type: string}

permissions:
  contents: read
concurrency:
  group: "bootstrap-coordination-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.target_repository, inputs.target_issue) || 'comment-serial' }}"
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repo: ${{ steps.request.outputs.repo }}
      issue: ${{ steps.request.outputs.issue }}
      sha: ${{ steps.request.outputs.sha }}
      governance: ${{ steps.request.outputs.governance }}
      idempotency: ${{ steps.request.outputs.idempotency }}
    steps:
      - id: request
        name: Resolver solicitud y validar autoridad
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_PR_URL: ${{ github.event.issue.pull_request.url || '' }}
          DISPATCH_REPOSITORY: ${{ inputs.target_repository || '' }}
          DISPATCH_ISSUE: ${{ inputs.target_issue || '' }}
          DISPATCH_SHA: ${{ inputs.expected_main_sha || '' }}
          DISPATCH_GOVERNANCE: ${{ inputs.governance_ref || '' }}
          DISPATCH_IDEMPOTENCY: ${{ inputs.idempotency_key || '' }}
        run: |
          set -euo pipefail
          [[ "$ACTOR" == "$OWNER" ]] || { echo "::error::solo owner"; exit 1; }
          [[ "$REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "::error::solo default branch"; exit 1; }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_repository="$DISPATCH_REPOSITORY"
            target_issue="$DISPATCH_ISSUE"
            expected_main_sha="$DISPATCH_SHA"
            governance_ref="$DISPATCH_GOVERNANCE"
            idempotency_key="$DISPATCH_IDEMPOTENCY"
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            [[ -z "$COMMENT_PR_URL" ]] || { echo "::error::comentarios de PR no permitidos"; exit 1; }
            if [[ "$COMMENT_BODY" =~ ^/bootstrap-coordination\ (pl0n3r/[A-Za-z0-9_.-]{1,100})\ ([1-9][0-9]*)\ ([0-9a-f]{40})$ ]]; then
              target_repository="${BASH_REMATCH[1]}"
              target_issue="${BASH_REMATCH[2]}"
              expected_main_sha="${BASH_REMATCH[3]}"
            else
              echo "::error::comando bootstrap inválido"
              exit 1
            fi
            governance_ref="pl0n3r/factory@v1"
            idempotency_key="$(printf '%s' "$target_repository|$target_issue|$expected_main_sha|$governance_ref" | sha256sum | cut -d' ' -f1)"
          else
            echo "::error::evento no permitido"
            exit 1
          fi

          [[ "$target_repository" =~ ^pl0n3r/[A-Za-z0-9_.-]{1,100}$ ]] || { echo "::error::repositorio inválido"; exit 1; }
          [[ "$target_issue" =~ ^[1-9][0-9]*$ ]] || { echo "::error::issue inválido"; exit 1; }
          [[ "$expected_main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha inválido"; exit 1; }
          [[ "$governance_ref" == "pl0n3r/factory@v1" ]] || { echo "::error::governance_ref inválido"; exit 1; }
          [[ "$idempotency_key" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::idempotency_key inválida"; exit 1; }

          printf 'repo=%s\nissue=%s\nsha=%s\ngovernance=%s\nidempotency=%s\n' \
            "$target_repository" "$target_issue" "$expected_main_sha" "$governance_ref" "$idempotency_key" >> "$GITHUB_OUTPUT"

  prepare:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', path: runtime, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: pl0n3r/factory, ref: v1, path: governance, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.resolve.outputs.repo }}
          ref: main
          path: consumer
          persist-credentials: false
      - name: Preparar contrato del consumidor sin secretos
        env:
          TARGET_REPOSITORY: ${{ needs.resolve.outputs.repo }}
          TARGET_ISSUE: ${{ needs.resolve.outputs.issue }}
          EXPECTED_MAIN_SHA: ${{ needs.resolve.outputs.sha }}
          GOVERNANCE_REF: ${{ needs.resolve.outputs.governance }}
          IDEMPOTENCY_KEY: ${{ needs.resolve.outputs.idempotency }}
        run: python3 runtime/scripts/bootstrap_coordination.py --prepare --consumer-root consumer
      - name: Publicar entrega preparada
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-bootstrap-delivery
          path: .factory-bootstrap-delivery.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  apply:
    needs: [resolve, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', path: runtime, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: pl0n3r/factory, ref: v1, path: governance, persist-credentials: false}
      - name: Descargar entrega preparada
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: factory-bootstrap-delivery
          path: ${{ runner.temp }}/factory-bootstrap-delivery
      - name: Crear rama y PR bootstrap desde entrega preparada
        env:
          TARGET_REPOSITORY: ${{ needs.resolve.outputs.repo }}
          TARGET_ISSUE: ${{ needs.resolve.outputs.issue }}
          EXPECTED_MAIN_SHA: ${{ needs.resolve.outputs.sha }}
          GOVERNANCE_REF: ${{ needs.resolve.outputs.governance }}
          IDEMPOTENCY_KEY: ${{ needs.resolve.outputs.idempotency }}
          FACTORY_PREPARED_DIR: ${{ runner.temp }}/factory-bootstrap-delivery
          FACTORY_PROVISION_TOKEN: ${{ secrets.FACTORY_PROVISION_TOKEN }}
        run: python3 runtime/scripts/bootstrap_coordination.py --apply-prepared
