name: Seguridad y puertas humanas

on:
  pull_request:
    paths:
      - 'seguridad/**'
      - 'docs/puertas-humanas.md'
      - '.github/workflows/seguridad.yml'
  push:
    branches: [main]
    paths:
      - 'seguridad/**'
      - '.github/workflows/seguridad.yml'
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar-candidato:
    name: Validar puertas del candidato
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Descargar candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ejecutar regresiones
        run: |
          set -euo pipefail
          python3 -m py_compile seguridad/puertas_humanas.py
          PYTHONPATH=seguridad python3 -m unittest discover -s seguridad -p 'test_puertas_humanas.py'
          python3 -m json.tool seguridad/puertas-humanas.json >/dev/null

  preparar-cola:
    name: Preparar cola de decisiones
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Crear etiqueta idempotente
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api --paginate "repos/$REPOSITORIO/labels?per_page=100" --jq '.[].name' \
            | grep -Fxq 'decisión: dueño'; then
            gh api --method POST "repos/$REPOSITORIO/labels" \
              -f name='decisión: dueño' \
              -f color='B60205' \
              -f description='Decisión reservada explícitamente al dueño.'
          fi

  sincronizar-decision:
    name: Validar y enrutar decisión
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Descargar política confiable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Autorizar origen
        id: actor
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          set -euo pipefail
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) echo "trusted=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "trusted=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Clasificar Issue
        id: gate
        if: steps.actor.outputs.trusted == 'true'
        run: |
          set -euo pipefail
          python3 seguridad/puertas_humanas.py \
            --format github < "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Enrutar puerta válida
        if: steps.actor.outputs.trusted == 'true' && steps.gate.outputs.status == 'gate'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          CATEGORY: ${{ steps.gate.outputs.category }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORIO/issues/$ISSUE" --jq '.labels[].name')"
          if ! grep -Fxq 'decisión: dueño' <<<"$current"; then
            if ! gh api --paginate "repos/$REPOSITORIO/labels?per_page=100" --jq '.[].name' \
              | grep -Fxq 'decisión: dueño'; then
              gh api --method POST "repos/$REPOSITORIO/labels" \
                -f name='decisión: dueño' -f color='B60205' \
                -f description='Decisión reservada explícitamente al dueño.'
            fi
            jq -n '{labels:["decisión: dueño"]}' \
              | gh api --method POST "repos/$REPOSITORIO/issues/$ISSUE/labels" --input -
            jq -n '{assignees:[env.OWNER]}' \
              | gh api --method POST "repos/$REPOSITORIO/issues/$ISSUE/assignees" --input -
            printf '@%s 🧭 DECISIÓN NECESARIA · categoría `%s`. Revisa el contexto, opciones, recomendación y default seguro en este Issue.\n' \
              "$OWNER" "$CATEGORY" \
              | jq -Rs '{body:.}' \
              | gh api --method POST "repos/$REPOSITORIO/issues/$ISSUE/comments" --input -
          fi

      - name: Retirar de la cola si no es puerta válida y confiable
        if: always() && (steps.actor.outputs.trusted != 'true' || steps.gate.outputs.status != 'gate')
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORIO/issues/$ISSUE" --jq '.labels[].name' \
            | grep -Fxq 'decisión: dueño'; then
            gh api --method DELETE \
              "repos/$REPOSITORIO/issues/$ISSUE/labels/decisi%C3%B3n%3A%20due%C3%B1o"
          fi
