name: Roles profesionales reutilizables

on:
  workflow_call:
    inputs:
      mode:
        description: 'sync, suggest o validate'
        required: true
        type: string
      number:
        description: 'Issue o PR para suggest/validate'
        required: false
        default: 0
        type: number
      language:
        description: 'es o en'
        required: false
        default: 'es'
        type: string

permissions:
  contents: read

concurrency:
  group: roles-${{ github.repository }}-${{ inputs.mode }}-${{ inputs.number || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validar contrato de entrada
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Validar modo, idioma y número
        env:
          MODE: ${{ inputs.mode }}
          LANGUAGE: ${{ inputs.language }}
          NUMBER: ${{ inputs.number }}
        run: |
          set -euo pipefail
          case "$MODE" in sync|suggest|validate) ;; *) echo "::error::mode inválido"; exit 1 ;; esac
          case "$LANGUAGE" in es|en) ;; *) echo "::error::language inválido"; exit 1 ;; esac
          if [[ "$MODE" != "sync" && "$NUMBER" == "0" ]]; then
            echo "::error::number es obligatorio para suggest/validate"
            exit 1
          fi

  validate:
    name: Validar evidencia de roles
    needs: preflight
    if: inputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Validar contexto read-only
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          NUMBER: ${{ inputs.number }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          [[ "$LANGUAGE" == "es" || "$LANGUAGE" == "en" ]] || { echo "::error::language inválido"; exit 1; }
          [[ "$EVENT_NAME" == "pull_request" && "$EVENT_PR" == "$NUMBER" && "$NUMBER" != "0" ]] || { echo "::error::validate requiere el PR actual"; exit 1; }

      - name: Descargar kit publicado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false

      - name: Validar catálogo
        run: python3 .factory/scripts/roles_kit.py validate-catalog

      - name: Construir contexto PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/issues/$NUMBER" > /tmp/entity.json
          gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files?per_page=100" --jq '.[].filename' \
            | jq -R -s 'split("\n") | map(select(length > 0))' > /tmp/files.json
          jq --slurpfile files /tmp/files.json '{
            title: (.title // ""),
            body: (.body // ""),
            labels: [(.labels // [])[].name],
            files: $files[0]
          }' /tmp/entity.json > /tmp/context.json


      - name: Acreditar scope de DTO offline con GitHub autenticado
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '{}\n' > /tmp/roles-verified-offline.json
          if [[ "$REPOSITORY" != "pl0n3r/ControlBot" || "$NUMBER" != "799" ]]; then
            exit 0
          fi
          gh api "repos/$REPOSITORY/pulls/$NUMBER" > /tmp/offline-pr.json
          gh api "repos/$REPOSITORY/issues/798" > /tmp/offline-issue.json
          gh api --paginate "repos/$REPOSITORY/issues/798/comments?per_page=100" --jq '.[]' \
            | jq -s '.' > /tmp/offline-leases.json
          gh api --paginate "repos/$REPOSITORY/issues/799/comments?per_page=100" --jq '.[]' \
            | jq -s '.' > /tmp/offline-reviews.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          paths = ["src/HealthIdentityPayload.php", "tests/test_health_identity_payload.py"]
          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))
          pr = read("/tmp/offline-pr.json")
          issue = read("/tmp/offline-issue.json")
          files = read("/tmp/files.json")
          leases = read("/tmp/offline-leases.json")
          reviews = read("/tmp/offline-reviews.json")
          sha = pr.get("head", {}).get("sha")
          event_sha = os.environ.get("EVENT_HEAD_SHA")
          if re.fullmatch(r"[0-9a-f]{40}", event_sha or "") is None or sha != event_sha:
              raise SystemExit("PR head differs from the triggering event head")
          match = re.search(
              r'<!-- factory-plan-task (\{[^\n]*\}) -->',
              issue.get("body") or "",
          )
          task = json.loads(match.group(1)) if match else {}
          authentic = [
              comment for comment in leases
              if comment.get("user", {}).get("login") == "github-actions[bot]"
              and comment.get("user", {}).get("type") == "Bot"
              and re.search(
                  r'<!-- condor-reserva (\{[^\n]*\}) -->',
                  comment.get("body") or "",
              )
          ]
          lease = {}
          if authentic:
              lease_mark = re.search(
                  r'<!-- condor-reserva (\{[^\n]*\}) -->',
                  authentic[-1]["body"],
              )
              lease = json.loads(lease_mark.group(1))
          reviewed = False
          for comment in reviews:
              if (comment.get("user", {}).get("login") != "coderabbitai[bot]"
                  or comment.get("user", {}).get("type") != "Bot"):
                  continue
              for match in re.finditer(
                  r'<!-- final_review_risk_coverage:(\{[^\n]*\}) -->',
                  comment.get("body") or "",
              ):
                  mark = json.loads(match.group(1))
                  if (mark.get("sourceCommitId") == sha
                      and mark.get("coveredCommitId") == sha
                      and mark.get("kind") == "reviewed"):
                      reviewed = True
          labels = {item.get("name") for item in issue.get("labels", [])}
          if (
              issue.get("number") == 798
              and issue.get("state") == "open"
              and "tipo: infraestructura" in labels
              and task.get("task_key") == "CB625_HEALTH_IDENTITY_PAYLOAD_V1"
              and task.get("paths") == paths
              and sorted(files) == paths
              and lease.get("active") is True
              and lease.get("version") == 3
              and lease.get("owner") == "pl0n3r"
              and lease.get("branch") == "trabajo/issue-798"
              and sorted(lease.get("task_paths", [])) == paths
              and pr.get("head", {}).get("ref") == "trabajo/issue-798"
              and re.fullmatch(r"[0-9a-f]{40}", sha or "")
              and reviewed
          ):
              scope = {
                  "source": "github-api-v3-and-exact-head-review-v1",
                  "repo": "pl0n3r/ControlBot", "issue": 798, "pr": 799,
                  "head_sha": sha, "reviewed_sha": sha,
                  "branch": "trabajo/issue-798",
                  "reservation_id": lease.get("reservation_id"),
                  "paths": paths,
              }
              Path("/tmp/roles-verified-offline.json").write_text(
                  json.dumps(scope, sort_keys=True), encoding="utf-8",
              )
          PY

      - name: Acreditar N/A SRE documental desde V3 y checks exact-HEAD
        if: github.repository == 'pl0n3r/ControlBot' && inputs.number == 838
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "pl0n3r/ControlBot" && "$NUMBER" == "838" ]] || exit 0
          gh api "repos/$REPOSITORY/pulls/$NUMBER" > /tmp/legal-pr.json
          gh api "repos/$REPOSITORY/issues/837" > /tmp/legal-issue.json
          gh api --paginate "repos/$REPOSITORY/issues/837/comments?per_page=100" --jq '.[]' | jq -s '.' > /tmp/legal-leases.json
          gh api --paginate "repos/$REPOSITORY/commits/$EVENT_HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '.' > /tmp/legal-checks.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          
          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))
          paths = [
              "docs/privacidad/canal-derechos.md",
              "docs/privacidad/politica-tratamiento.md",
              "revision-juridica/00-LEEME.md",
              "revision-juridica/canal-derechos.md",
              "revision-juridica/paquete-completo.md",
              "revision-juridica/politica-tratamiento.md",
          ]
          pr, issue, files = load("/tmp/legal-pr.json"), load("/tmp/legal-issue.json"), load("/tmp/files.json")
          leases, runs = load("/tmp/legal-leases.json"), load("/tmp/legal-checks.json")
          head = os.environ.get("EVENT_HEAD_SHA")
          if not head or not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("Invalid event SHA")
          if (
              pr.get("state") != "open"
              or pr.get("draft") is not False
              or pr.get("number") != 838
              or pr.get("head", {}).get("sha") != head
              or pr.get("head", {}).get("ref") != "trabajo/issue-837"
              or pr.get("head", {}).get("repo", {}).get("full_name") != "pl0n3r/ControlBot"
              or pr.get("base", {}).get("repo", {}).get("full_name") != "pl0n3r/ControlBot"
              or issue.get("state") != "open"
              or issue.get("number") != 837
              or sorted(files) != paths
              or len(files) != len(paths)
          ):
              raise SystemExit("Scope of legal-document PR unverified")
          marker = re.search(r'<!-- factory-plan-task (\{[^\n]*\}) -->', issue.get("body") or "")
          task = json.loads(marker.group(1)) if marker else {}
          labels = {v.get("name") for v in issue.get("labels") or []}
          if (
              task.get("task_key") != "CB_PRIVACY_DOC_SYNC_V1"
              or sorted(task.get("paths", [])) != paths
              or task.get("depends_on") != []
              or "tipo: incidente" not in labels
              or "rol: sre" not in labels
          ):
              raise SystemExit("Unpinned task/role")
          authentic = [
              v for v in leases
              if v.get("user", {}).get("login") == "github-actions[bot]"
              and v.get("user", {}).get("type") == "Bot"
              and re.search(r'<!-- condor-reserva (\{[^\n]*\}) -->', v.get("body") or "")
          ]
          if not authentic:
              raise SystemExit("No authenticated V3 receipt")
          raw = re.search(r'<!-- condor-reserva (\{[^\n]*\}) -->', authentic[-1]["body"])
          lease = json.loads(raw.group(1))
          if (
              lease.get("version") != 3 or lease.get("active") is not True
              or lease.get("owner") != "pl0n3r"
              or lease.get("branch") != "trabajo/issue-837"
              or sorted(lease.get("task_paths", [])) != paths
              or lease.get("task_marker_sha256") != "7c93d50525ea913cd8cfb45218965d122d8a10858d1219d6997d5b5eb71e55f2"
              or lease.get("acceptance_sha256") != "80eb2e833760534e348d7e1e9a0bf25578e2ad6f0480339a461ef28d970921a0"
              or not re.fullmatch(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", lease.get("reservation_id") or "")
          ):
              raise SystemExit("Invalid/expired V3 for legal-doc task")
          names = ("Validar", "privacidad / Privacidad como código")
          for name in names:
              found = [
                  c for c in runs
                  if c.get("name") == name
                  and c.get("head_sha") == head
                  and c.get("app", {}).get("id") == 15368
                  and isinstance(c.get("id"), int)
              ]
              if not found or max(found, key=lambda c: c["id"]).get("conclusion") != "success":
                  raise SystemExit("Missing exact-head trusted green check: " + name)
          scope = {
              "source": "github-api-v3-and-exact-head-ci-docs-v1",
              "repo": "pl0n3r/ControlBot", "issue": 837, "pr": 838,
              "head_sha": head, "branch": "trabajo/issue-837",
              "reservation_id": lease["reservation_id"], "paths": paths,
              "checks": list(names),
          }
          Path("/tmp/roles-verified-offline.json").write_text(
              json.dumps(scope, sort_keys=True), encoding="utf-8")
          PY

      - name: Validar PR
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          FACTORY_ROLES_VERIFIED_SCOPE="$(cat /tmp/roles-verified-offline.json)" \
            python3 .factory/scripts/roles_kit.py validate-pr --language "$LANGUAGE" \
            < /tmp/context.json >> "$GITHUB_STEP_SUMMARY"

  mutate:
    name: Sincronizar o sugerir roles
    needs: preflight
    if: inputs.mode == 'sync' || inputs.mode == 'suggest'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Validar contexto con escritura
        env:
          MODE: ${{ inputs.mode }}
          LANGUAGE: ${{ inputs.language }}
          NUMBER: ${{ inputs.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$LANGUAGE" == "es" || "$LANGUAGE" == "en" ]] || { echo "::error::language inválido"; exit 1; }
          if [[ "$MODE" == "sync" ]]; then
            case "$EVENT_NAME" in push|workflow_dispatch) ;; *) echo "::error::sync requiere push/workflow_dispatch"; exit 1 ;; esac
            [[ "$REF_NAME" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "::error::sync solo acepta rama principal"; exit 1; }
          else
            case "$EVENT_NAME" in
              issues) [[ "$EVENT_ISSUE" == "$NUMBER" && "$NUMBER" != "0" ]] ;;
              pull_request) [[ "$EVENT_PR" == "$NUMBER" && "$NUMBER" != "0" ]] ;;
              workflow_dispatch) [[ "$REF_NAME" == "refs/heads/$DEFAULT_BRANCH" && "$NUMBER" != "0" ]] ;;
              *) false ;;
            esac || { echo "::error::suggest requiere la entidad del evento o dispatch en main"; exit 1; }
          fi

      - name: Descargar kit publicado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false

      - name: Validar catálogo
        run: python3 .factory/scripts/roles_kit.py validate-catalog

      - name: Sincronizar etiquetas de rol
        if: inputs.mode == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/roles_kit.py labels --language "$LANGUAGE" > /tmp/role-labels.json
          jq -r '.[]' /tmp/role-labels.json | while IFS= read -r name; do
            gh label create "$name" --repo "$REPOSITORY" --color 5319E7 \
              --description "Rol profesional requerido por Factory" --force >/dev/null
          done

      - name: Construir contexto para sugerencia
        if: inputs.mode == 'suggest'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/issues/$NUMBER" > /tmp/entity.json
          is_pr="$(jq 'has("pull_request")' /tmp/entity.json)"
          if [[ "$is_pr" == "true" ]]; then
            gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files?per_page=100" --jq '.[].filename' \
              | jq -R -s 'split("\n") | map(select(length > 0))' > /tmp/files.json
          else
            printf '[]\n' > /tmp/files.json
          fi
          jq --slurpfile files /tmp/files.json '{
            title: (.title // ""),
            body: (.body // ""),
            labels: [(.labels // [])[].name],
            files: $files[0]
          }' /tmp/entity.json > /tmp/context.json

      - name: Sugerir y asignar roles
        if: inputs.mode == 'suggest'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          python3 .factory/scripts/roles_kit.py suggest --language "$LANGUAGE" \
            < /tmp/context.json > /tmp/suggestion.json
          jq -r '.labels[]' /tmp/suggestion.json | while IFS= read -r label; do
            gh issue edit "$NUMBER" --repo "$REPOSITORY" --add-label "$label" >/dev/null
          done
          jq '{roles, risks}' /tmp/suggestion.json >> "$GITHUB_STEP_SUMMARY"
