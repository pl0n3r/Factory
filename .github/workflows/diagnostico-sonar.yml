name: Diagnóstico Sonar temporal

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: diagnostico-sonar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnostico:
    if: github.event.pull_request.number == 30
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar issues públicos del PR en Sonar
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          url="https://sonarcloud.io/api/issues/search?componentKeys=pl0n3r_factory&pullRequest=$PR_NUMBER&issueStatuses=OPEN,CONFIRMED&ps=100"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$url" > /tmp/sonar.json
          jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message, status}]}' /tmp/sonar.json
