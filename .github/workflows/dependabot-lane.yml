name: Dependabot protegido Factory

on:
  workflow_run:
    workflows: ['CI factory']
    types: [completed]
  schedule:
    - cron: '29 10 * * *'

permissions:
  contents: read

concurrency:
  group: dependabot-factory-${{ github.repository_id }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  dependabot:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.actor.id == 49699333 &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      github.event.workflow_run.pull_requests[1] == null &&
      github.event.workflow_run.pull_requests[0].head.sha == github.event.workflow_run.head_sha
    permissions:
      contents: write
      actions: write
      checks: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/dependabot.yml
    with:
      operation: dependabot
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head_sha: ${{ github.event.workflow_run.head_sha }}

  dependabot-sweep:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
      checks: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/dependabot.yml
    with:
      operation: dependabot-sweep
