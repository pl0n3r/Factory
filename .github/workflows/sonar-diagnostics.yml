name: Diagnóstico Sonar temporal
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: sonar-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  issues:
    name: Leer findings públicos de Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar API pública
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_KEY: pl0n3r_factory
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode "componentKeys=$PROJECT_KEY" \
            --data-urlencode "pullRequest=$PR_NUMBER" \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100' > /tmp/sonar-issues.json
          jq '{total: .total, issues: [.issues[] | {key, rule, severity, type, status, component, line, message, impacts}]}' /tmp/sonar-issues.json
