name: Política reviewer-bot por comentario
on:
  workflow_call:
    inputs:
      pr_number: {required: true, type: number}
      comment_id: {required: true, type: number}
      required_review_bot: {required: false, type: string, default: ""}

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  revalidar:
    name: Revalidar comentario reviewer-bot
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar evento, PR, comentario y policy base antes de checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR: ${{ github.event.issue.number }}
          EVENT_COMMENT: ${{ github.event.comment.id }}
          EVENT_IS_PR: ${{ github.event.issue.pull_request != null }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_COMMENT: ${{ inputs.comment_id }}
          CALLER_REQUIRED_REVIEW_BOT: ${{ inputs.required_review_bot }}
          MAX_POLICY_BYTES: "4096"
          MAX_DECISIONS_BYTES: "262144"
          MAX_EVIDENCE_BYTES: "2000000"
          MAX_PUBLIC_CHECKS: "500"
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "issue_comment" ]] || { echo "::error::Evento no permitido"; exit 1; }
          case "$EVENT_ACTION" in
            created|edited) ;;
            *) echo "::error::Acción de comentario no permitida"; exit 1 ;;
          esac
          [[ "$EVENT_IS_PR" == "true" ]] || { echo "RELEVANT=false" >> "$GITHUB_ENV"; exit 0; }
          [[ "$EVENT_PR" == "$INPUT_PR" ]] || { echo "::error::PR de evento inválido"; exit 1; }
          [[ "$EVENT_COMMENT" == "$INPUT_COMMENT" ]] || { echo "::error::Comentario de evento inválido"; exit 1; }

          COMMENT_JSON="$(gh api "repos/$REPOSITORY/issues/comments/$INPUT_COMMENT")"
          COMMENT_API_ID="$(jq -r '.id' <<<"$COMMENT_JSON")"
          COMMENT_ISSUE_URL="$(jq -r '.issue_url // empty' <<<"$COMMENT_JSON")"
          COMMENT_TYPE="$(jq -r '.user.type // empty' <<<"$COMMENT_JSON")"
          COMMENT_LOGIN="$(jq -r '.user.login // empty' <<<"$COMMENT_JSON")"
          [[ "$COMMENT_API_ID" == "$INPUT_COMMENT" ]] || { echo "::error::ID de comentario inválido"; exit 1; }
          [[ "$COMMENT_ISSUE_URL" == */issues/"$INPUT_PR" ]] || { echo "::error::Comentario no pertenece al PR"; exit 1; }
          if [[ "$COMMENT_TYPE" != "Bot" ]]; then
            echo "RELEVANT=false" >> "$GITHUB_ENV"
            exit 0
          fi

          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$INPUT_PR")"
          [[ "$(jq -r '.state' <<<"$PR_JSON")" == "open" ]] || { echo "RELEVANT=false" >> "$GITHUB_ENV"; exit 0; }
          CURRENT_HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
          CURRENT_BASE="$(jq -r '.base.sha' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON")"
          BASE_REPO="$(jq -r '.base.repo.full_name // empty' <<<"$PR_JSON")"
          [[ "$BASE_REPO" == "$REPOSITORY" ]] || { echo "::error::Repositorio base inesperado"; exit 1; }
          [[ "$CURRENT_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::HEAD inválido"; exit 1; }
          [[ "$CURRENT_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::BASE inválida"; exit 1; }
          [[ -n "$HEAD_REPO" ]] || { echo "::error::Repositorio HEAD inválido"; exit 1; }

          POLICY_FILE="/tmp/factory-policy-base.json"
          POLICY_ERR="/tmp/factory-policy-base.err"
          BASE_REQUIRED=""
          if gh api -H "Accept: application/vnd.github.raw+json"               "repos/$REPOSITORY/contents/.github/factory-policy.json?ref=$CURRENT_BASE"               > "$POLICY_FILE" 2> "$POLICY_ERR"; then
            POLICY_BYTES="$(wc -c < "$POLICY_FILE")"
            (( POLICY_BYTES <= MAX_POLICY_BYTES )) || { echo "::error::factory-policy.json excede el límite"; exit 1; }
            jq -e '
              type == "object" and
              (keys == ["required_review_bot","version"]) and
              .version == 1 and
              (.required_review_bot == null or (.required_review_bot | type == "string"))
            ' "$POLICY_FILE" >/dev/null || { echo "::error::factory-policy.json inválido"; exit 1; }
            [[ "$(jq -r '.required_review_bot == ""' "$POLICY_FILE")" != "true" ]] || { echo "::error::Reviewer-bot base vacío es inválido"; exit 1; }
            BASE_REQUIRED="$(jq -r '.required_review_bot // empty' "$POLICY_FILE")"
            echo "BASE_POLICY_FILE=$POLICY_FILE" >> "$GITHUB_ENV"
          elif grep -q "HTTP 404" "$POLICY_ERR"; then
            rm -f "$POLICY_FILE"
            echo "BASE_POLICY_FILE=" >> "$GITHUB_ENV"
          else
            cat "$POLICY_ERR" >&2
            echo "::error::No se pudo leer policy desde BASE exacta"
            exit 1
          fi

          BOT_RE='^[A-Za-z0-9][A-Za-z0-9-]{0,99}(\[bot\])?$'
          [[ -z "$BASE_REQUIRED" || "$BASE_REQUIRED" =~ $BOT_RE ]] || { echo "::error::Reviewer-bot base inválido"; exit 1; }
          [[ -z "$CALLER_REQUIRED_REVIEW_BOT" || "$CALLER_REQUIRED_REVIEW_BOT" =~ $BOT_RE ]] || { echo "::error::Reviewer-bot caller inválido"; exit 1; }
          EFFECTIVE_REQUIRED="$CALLER_REQUIRED_REVIEW_BOT"
          if [[ -n "$BASE_REQUIRED" ]]; then
            [[ -z "$CALLER_REQUIRED_REVIEW_BOT" || "$CALLER_REQUIRED_REVIEW_BOT" == "$BASE_REQUIRED" ]] || { echo "::error::Caller no puede cambiar reviewer-bot de BASE"; exit 1; }
            EFFECTIVE_REQUIRED="$BASE_REQUIRED"
          fi
          if [[ -z "$EFFECTIVE_REQUIRED" || "$COMMENT_LOGIN" != "$EFFECTIVE_REQUIRED" ]]; then
            echo "RELEVANT=false" >> "$GITHUB_ENV"
            exit 0
          fi

          DECISIONS_FILE="$GITHUB_WORKSPACE/decisiones.yml"
          REVIEWS_FILE="/tmp/politica-reviews.ndjson"
          COMMENTS_FILE="/tmp/politica-comments.ndjson"
          gh api -H "Accept: application/vnd.github.raw+json"             "repos/$HEAD_REPO/contents/decisiones.yml?ref=$CURRENT_HEAD" > "$DECISIONS_FILE"
          DECISIONS_BYTES="$(wc -c < "$DECISIONS_FILE")"
          (( DECISIONS_BYTES <= MAX_DECISIONS_BYTES )) || { echo "::error::decisiones.yml excede el límite"; exit 1; }

          gh api --paginate "repos/$REPOSITORY/pulls/$INPUT_PR/reviews?per_page=100"             --jq '.[] | @json' > "$REVIEWS_FILE"
          gh api --paginate "repos/$REPOSITORY/issues/$INPUT_PR/comments?per_page=100"             --jq '.[] | @json' > "$COMMENTS_FILE"
          (( $(wc -c < "$REVIEWS_FILE") <= MAX_EVIDENCE_BYTES )) || { echo "::error::Reviews exceden el límite"; exit 1; }
          (( $(wc -c < "$COMMENTS_FILE") <= MAX_EVIDENCE_BYTES )) || { echo "::error::Comentarios exceden el límite"; exit 1; }

          # POLICY_COMMENT_EVIDENCE_BEGIN
          # No publicar success desde un review aislado: seis gates exact-HEAD,
          # inventario estable y todos los threads autenticados son obligatorios.
          CHECKS_FILE="$(mktemp)"
          CHECKS_JSON="$(mktemp)"
          CHECKS_PREVIOUS="$(mktemp)"
          CHECKS_CURRENT="$(mktemp)"
          THREADS_FILE="$(mktemp)"
          THREADS_JSON="$(mktemp)"
          checks_url="repos/$REPOSITORY/commits/$CURRENT_HEAD/check-runs?per_page=100"
          previous_complete=false
          stable_snapshot=false
          for attempt in 1 2 3; do
            : > "$CHECKS_FILE"
            expected_total=""
            observed_count=0
            drift=false
            for page in 1 2 3 4 5; do
              gh api -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$checks_url&page=$page" > "$CHECKS_JSON" || {
                  echo "::error::No se pudo leer check-runs autenticados"
                  exit 1
                }
              (( $(wc -c < "$CHECKS_JSON") <= MAX_EVIDENCE_BYTES )) || {
                echo "::error::Página de check-runs excesiva"
                exit 1
              }
              jq -e '
                type == "object"
                and (.total_count | type == "number")
                and (.total_count >= 0)
                and (.total_count == (.total_count | floor))
                and (.check_runs | type == "array")
                and (.check_runs | length <= 100)
              ' "$CHECKS_JSON" >/dev/null || {
                echo "::error::Respuesta de check-runs malformada"
                exit 1
              }
              page_total="$(jq -r '.total_count' "$CHECKS_JSON")"
              (( page_total <= MAX_PUBLIC_CHECKS )) || {
                echo "::error::Exceso de check-runs"
                exit 1
              }
              if [[ -z "$expected_total" ]]; then
                expected_total="$page_total"
              elif [[ "$expected_total" != "$page_total" ]]; then
                echo "::warning::total_count cambió entre páginas de check-runs (intento $attempt/3)"
                drift=true
                break
              fi
              jq -c '.check_runs[]' "$CHECKS_JSON" >> "$CHECKS_FILE"
              observed_count="$(wc -l < "$CHECKS_FILE")"
              (( observed_count <= expected_total )) || {
                echo "::error::Páginas solapadas de check-runs"
                exit 1
              }
              if (( observed_count == expected_total )); then break; fi
            done
            if [[ "$drift" == true ]]; then
              previous_complete=false
              continue
            fi
            [[ -n "$expected_total" && "$observed_count" == "$expected_total" ]] || {
              echo "::error::Inventario de checks incompleto"
              exit 1
            }
            (( $(wc -c < "$CHECKS_FILE") <= MAX_EVIDENCE_BYTES )) || {
              echo "::error::Inventario de checks excesivo"
              exit 1
            }
            jq -s -e '
              all(.[]; ((.id | type) == "number" and .id > 0))
              and (([.[].id] | length) == ([.[].id] | unique | length))
            ' "$CHECKS_FILE" >/dev/null || {
              echo "::error::IDs de checks duplicados o inválidos"
              exit 1
            }
            jq -s -c 'sort_by(.id)' "$CHECKS_FILE" > "$CHECKS_CURRENT"
            if [[ "$previous_complete" == true ]] && \
               cmp -s "$CHECKS_PREVIOUS" "$CHECKS_CURRENT"; then
              stable_snapshot=true
              break
            fi
            cp "$CHECKS_CURRENT" "$CHECKS_PREVIOUS"
            previous_complete=true
          done
          [[ "$stable_snapshot" == true ]] || {
            echo "::error::check-runs sin dos snapshots completos y estables"
            exit 1
          }

          owner_name="${REPOSITORY%%/*}"
          repo_name="${REPOSITORY#*/}"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewThreads(first:100){pageInfo{hasNextPage} nodes{isResolved comments(first:100){pageInfo{hasNextPage} nodes{author{login}}}}}}}}' \
            -F owner="$owner_name" -F repo="$repo_name" -F pr="$INPUT_PR" > "$THREADS_JSON" || {
              echo "::error::GraphQL threads no disponible"
              exit 1
            }
          (( $(wc -c < "$THREADS_JSON") <= MAX_EVIDENCE_BYTES )) || {
            echo "::error::JSON de threads excesivo"
            exit 1
          }
          jq -e '(.errors // []) | length == 0' "$THREADS_JSON" >/dev/null || {
            echo "::error::GraphQL con errores"
            exit 1
          }
          jq -e '
            .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false
            and (.data.repository.pullRequest.reviewThreads.nodes | type == "array")
            and (.data.repository.pullRequest.reviewThreads.nodes | length <= 100)
          ' "$THREADS_JSON" >/dev/null || {
            echo "::error::reviewThreads paginados o inválidos"
            exit 1
          }
          jq -e '
            [.data.repository.pullRequest.reviewThreads.nodes[].comments.pageInfo.hasNextPage]
            | all(. == false)
          ' "$THREADS_JSON" >/dev/null || {
            echo "::error::Comentarios de review thread paginados"
            exit 1
          }
          jq -e '
            all(.data.repository.pullRequest.reviewThreads.nodes[];
                (.isResolved | type) == "boolean"
                and (.comments.nodes | type) == "array"
                and (.comments.nodes | length <= 100)
                and all(.comments.nodes[]; (.author.login | type) == "string"))
          ' "$THREADS_JSON" >/dev/null || {
            echo "::error::Review threads con estructura inválida"
            exit 1
          }
          jq -c '.data.repository.pullRequest.reviewThreads.nodes[]' "$THREADS_JSON" > "$THREADS_FILE"
          (( $(wc -c < "$THREADS_FILE") <= MAX_EVIDENCE_BYTES )) || {
            echo "::error::Threads exceden límite"
            exit 1
          }
          # POLICY_COMMENT_EVIDENCE_END

          {
            echo "RELEVANT=true"
            echo "PR_HEAD_SHA=$CURRENT_HEAD"
            echo "PR_BASE_SHA=$CURRENT_BASE"
            echo "PR_HEAD_REPO=$HEAD_REPO"
            echo "PR_BASE_REPO=$BASE_REPO"
            echo "REVIEWS_FILE=$REVIEWS_FILE"
            echo "COMMENTS_FILE=$COMMENTS_FILE"
            echo "CHECKS_FILE=$CHECKS_FILE"
            echo "THREADS_FILE=$THREADS_FILE"
          } >> "$GITHUB_ENV"

      - name: Descargar únicamente Factory versionado
        if: env.RELEVANT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          # El tag v1 conserva un predicado primario anterior a #1064/#1072/#1069.
          # Fijar una revisión inmutable, auditada, sin mover ni publicar v1.
          ref: b0713650194e9a0c464d625bc6136eecad776377
          path: .factory
          persist-credentials: false

      - name: Evaluar y materializar check sobre HEAD exacto
        if: env.RELEVANT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          CALLER_REQUIRED_REVIEW_BOT: ${{ inputs.required_review_bot }}
          CHECK_NAME: Factory policy / Validar decisiones y límite de revisión
        run: |
          set -euo pipefail
          args=(--required-review-bot "$CALLER_REQUIRED_REVIEW_BOT" --head-sha "$PR_HEAD_SHA" --comments-file "$COMMENTS_FILE" --checks-file "$CHECKS_FILE" --threads-file "$THREADS_FILE")
          [[ -z "${BASE_POLICY_FILE:-}" ]] || args+=(--base-policy-file "$BASE_POLICY_FILE")

          set +e
          POLICY_OUTPUT="$(python3 .factory/scripts/politica_kit.py "${args[@]}" < "$REVIEWS_FILE" 2>&1)"
          POLICY_STATUS=$?
          set -e

          PR_JSON_FINAL="$(gh api "repos/$REPOSITORY/pulls/$PR")"
          FINAL_STATE="$(jq -r '.state' <<<"$PR_JSON_FINAL")"
          FINAL_HEAD="$(jq -r '.head.sha' <<<"$PR_JSON_FINAL")"
          FINAL_BASE="$(jq -r '.base.sha' <<<"$PR_JSON_FINAL")"
          FINAL_HEAD_REPO="$(jq -r '.head.repo.full_name // empty' <<<"$PR_JSON_FINAL")"
          FINAL_BASE_REPO="$(jq -r '.base.repo.full_name // empty' <<<"$PR_JSON_FINAL")"
          if [[ "$FINAL_STATE" != "open" || "$FINAL_HEAD" != "$PR_HEAD_SHA" || "$FINAL_BASE" != "$PR_BASE_SHA" ||                 "$FINAL_HEAD_REPO" != "$PR_HEAD_REPO" || "$FINAL_BASE_REPO" != "$PR_BASE_REPO" ]]; then
            echo "::warning::PR cambió durante la revalidación; no se publica check stale."
            exit 0
          fi

          if (( POLICY_STATUS == 0 )); then
            CONCLUSION="success"
            TITLE="Policy reviewer-bot satisfecha"
          else
            CONCLUSION="failure"
            TITLE="Policy reviewer-bot no satisfecha"
          fi
          SUMMARY="$(printf '%s' "$POLICY_OUTPUT" | tail -c 12000)"
          PAYLOAD="$(jq -n             --arg name "$CHECK_NAME"             --arg head_sha "$PR_HEAD_SHA"             --arg conclusion "$CONCLUSION"             --arg title "$TITLE"             --arg summary "$SUMMARY"             '{name:$name,head_sha:$head_sha,status:"completed",conclusion:$conclusion,output:{title:$title,summary:$summary}}')"
          gh api --method POST "repos/$REPOSITORY/check-runs" --input - <<<"$PAYLOAD" >/dev/null

          if (( POLICY_STATUS != 0 )); then
            printf '%s\n' "$POLICY_OUTPUT" >&2
            exit "$POLICY_STATUS"
          fi
